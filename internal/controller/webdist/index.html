    .chart-hover-point{fill:var(--panel);stroke:var(--text);stroke-width:2.2;pointer-events:none;vector-effect:non-scaling-stroke}
    .chart-hover-line[hidden],.chart-hover-point[hidden]{display:none}
    .service-chart-hit-sample{fill:transparent;pointer-events:none}

    .chart-tooltip[hidden]{display:none}
    .chart-tooltip-time{display:block;margin-bottom:4px;color:var(--muted);font-size:10px;white-space:nowrap}
    .chart-tooltip-value{display:block;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
    .service-chart-tooltip-values{display:grid;gap:5px}
    .service-chart-tooltip-value{display:grid;grid-template-columns:minmax(72px,1fr) minmax(0,1.5fr);align-items:start;gap:10px}
    .service-chart-tooltip-name{display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted)}
    .service-chart-tooltip-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .service-chart-tooltip-dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--blue)}
    .service-chart-tooltip-value strong{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .service-chart-tooltip-value.failed strong{color:var(--red)}
    .modal-wide{width:min(calc(100vw - 40px),1500px);height:calc(100vh - 40px);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
    .modal-wide .modal-head{position:sticky;top:0;z-index:3;flex:0 0 auto;background:var(--panel)}
    .modal-wide .node-detail-modal-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
    @media(max-width:700px){
      .service-check-heading,.service-history-head{display:block}
      .service-check-selector{justify-content:flex-start;max-width:none;margin-top:12px}
      .service-check-option{flex:1 1 140px}
      .service-check-row{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}
      .service-check-result{grid-column:1/-1}
      .service-check-type{grid-column:2;grid-row:1}
      .service-check-chart-host{min-height:300px}
      .chart-tooltip{max-width:calc(100% - 8px)}
      .modal-backdrop:has(.modal-wide){padding:8px}
      .modal-wide{width:calc(100vw - 16px);height:calc(100dvh - 16px);max-height:calc(100dvh - 16px)}
      .modal-wide .modal-head{padding:14px 15px}
      .modal-wide .node-detail-modal-body{padding:15px}
    }

     function chartLine(samples,getter,formatter){const visible=(samples||[]).slice(-72);if(!visible.length)return '<div class="empty chart-empty">暂无历史指标</div>';const values=visible.map(sample=>{const value=Number(getter(sample));return Number.isFinite(value)?value:0;});let min=Math.min(...values),max=Math.max(...values),range=max-min;if(range===0){range=Math.max(Math.abs(max)*.2,1);min=Math.max(0,min-range/2);max=max+range/2;}else{const padding=range*.1;min=Math.max(0,min-padding);max=max+padding;}const width=640,height=190,left=42,right=10,top=12,bottom=30,plotWidth=width-left-right,plotHeight=height-top-bottom,baseY=top+plotHeight;const pointAt=(value,index)=>{const x=visible.length===1?left+plotWidth/2:left+index/(visible.length-1)*plotWidth;const y=top+(max-value)/(max-min)*plotHeight;return {x,y};};const points=values.map(pointAt);const pointString=points.map(point=>`${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(' ');const areaPath=`M ${points[0].x.toFixed(2)} ${baseY.toFixed(2)} L ${pointString.replace(/,/g,' ')} L ${points[points.length-1].x.toFixed(2)} ${baseY.toFixed(2)} Z`;const gridValues=[max,(max+min)/2,min];const grid=gridValues.map(value=>{const y=top+(max-value)/(max-min)*plotHeight;return `<line class="chart-grid-line" x1="${left}" y1="${y.toFixed(2)}" x2="${width-right}" y2="${y.toFixed(2)}"></line><text class="chart-axis-label" x="${left-8}" y="${(y+3).toFixed(2)}" text-anchor="end">${esc(formatter(value))}</text>`;}).join('');const labelIndexes=[0,Math.floor((visible.length-1)/2),visible.length-1].filter((index,position,all)=>all.indexOf(index)===position);const labels=labelIndexes.map(index=>{const date=new Date(visible[index].observed_at);const label=Number.isNaN(date.getTime())?'--':`${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;const point=points[index];return `<text class="chart-axis-label" x="${point.x.toFixed(2)}" y="${height-7}" text-anchor="middle">${esc(label)}</text>`;}).join('');const circles=points.map((point,index)=>{const date=new Date(visible[index].observed_at);const timestamp=Number.isNaN(date.getTime())?'未知时间':date.toLocaleString();return `<circle class="chart-point" cx="${point.x.toFixed(2)}" cy="${point.y.toFixed(2)}" r="2.8"><title>${esc(timestamp)} · ${esc(formatter(values[index]))}</title></circle>`;}).join('');return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="历史指标折线图"><g>${grid}${labels}</g><path class="chart-area" d="${areaPath}"></path><polyline class="chart-line" points="${pointString}"></polyline><g>${circles}</g></svg>`;}

    function updatePrivateDashboardView(){const privatePage=document.querySelector('.private-page');const adminContent=document.querySelector('.shell .content');if(!privatePage&&!adminContent){render();return;}const d=state.dashboard||{nodes:[]};const nodes=d.nodes||[];if(privatePage){updateLiveDashboardSummary(false);const generated=d.generated_at_unix?d.generated_at_unix*1000:null;privatePage.querySelectorAll('.public-updated').forEach(item=>item.textContent='更新于 '+fmtTime(generated));const wallUpdated=privatePage.querySelector('.node-wall .wall-head .muted');if(wallUpdated)wallUpdated.textContent='更新于 '+fmtTime(generated);updateOverviewWall();return;}if(state.view==='nodes'){const visible=sortNodes(visibleNodes(nodes));const table=adminContent.querySelector('.panel .table tbody');if(table){table.innerHTML=nodeRows(visible,visible.length!==nodes.length);bindNodeItems();}const count=adminContent.querySelector('.panel .panel-head .muted');if(count)count.textContent=`${visible.length} / ${nodes.length} 个`;const group=adminContent.querySelector('#admin-group-filter');if(group){const value=state.filters.group;group.innerHTML=groupOptions(nodes);group.value=value;}}}

    function updateLiveNode(data){
      const publicPage=!state.user&&state.area!=='admin'&&!state.showLogin;
      const nodes=publicPage?(state.publicDashboard?.nodes||[]):(state.nodes||[]);
      const node=nodes.find(item=>item.id===data.node_id);
      if(!node)return;
      node.status='online';
      if(data.metrics_available){
        if(publicPage){
          node.cpu_percent=Number(data.cpu_percent||0);
          node.memory_percent=Number(data.memory_percent||0);
          node.disk_percent=Number(data.disk_percent||0);
          node.load1=Number(data.load1||0);
          node.uptime_seconds=Number(data.uptime_seconds||0);
          if(Object.prototype.hasOwnProperty.call(data,'network_in_bytes'))node.network_in_bytes=Number(data.network_in_bytes||0);
          if(Object.prototype.hasOwnProperty.call(data,'network_out_bytes'))node.network_out_bytes=Number(data.network_out_bytes||0);
        }else if(data.metrics)node.metrics=data.metrics;
      }
      if(data.agent_version&&!publicPage)node.agent_version=data.agent_version;
      if(data.system&&!publicPage)node.system=data.system;
      if(data.observed_at_unix_milli)node.last_seen=new Date(Number(data.observed_at_unix_milli)).toISOString();
      const adminTable=!publicPage&&state.area==='admin'&&state.view==='nodes';
      const selector=publicPage?'[data-public-node]':'[data-node]';
      const current=[...document.querySelectorAll(selector)].find(item=>(publicPage?item.dataset.publicNode:item.dataset.node)===data.node_id);
      if(current&&!adminTable){
        replaceLiveElement(current,publicPage?publicNodeCards([node]):nodeCard(node));
        if(!publicPage)bindNodeItems();
        window.nyasmBindPublicNodeCards?.();
      }
      if(adminTable){
        const row=[...document.querySelectorAll('tr[data-node]')].find(item=>item.dataset.node===data.node_id);
        if(row){replaceLiveElement(row,nodeRows([node]));bindNodeItems();}
      }
      updateLiveDashboardSummary(publicPage);
      updateLiveNetworkViews(data.node_id);
      window.nyasmApplyLiveTelemetry?.(data);
    }

    function renderModal(){const existing=document.querySelector('.modal-backdrop');if(existing)existing.remove();if(!state.modal)return;const type=state.modal==='create'?'node':state.modal.type;const rule=type==='rule'?(state.modal.data||{}):{};const channels=state.alerts?.channels||[];let title='添加节点';let content='';if(type==='credential'){const command=state.modal.data.install_command||'当前 controller 未配置可下载的 node 二进制，请使用环境文件手动部署。';title='节点凭据';content=`<div class="notice">token 只在此处显示。安装命令会从 controller 下载脚本和 node 二进制，并安装 systemd 服务；轮换凭据会立即使旧 token 失效。</div><div class="field"><label>一键安装命令</label><pre class="token" id="install-command">${esc(command)}</pre></div><div class="field"><label>节点环境文件</label><pre class="token" id="credential-env">${esc(state.modal.data.env)}</pre></div><div class="actions" style="margin-top:14px"><button class="btn" id="copy-install">复制安装命令</button><button class="btn" id="copy-env">复制环境文件</button><button class="btn primary" id="close-modal">完成</button></div>`;}else if(type==='channel'){title='添加通知渠道';content=`<form id="channel-form" class="form"><div class="field"><label>名称</label><input name="name" required maxlength="128" placeholder="例如：运维 Webhook"></div><div class="field"><label>类型</label><select name="type"><option value="webhook">Webhook</option><option value="telegram">Telegram</option></select></div><div class="field"><label>目标</label><input name="target" required maxlength="2048" placeholder="Webhook HTTPS URL 或 Telegram Chat ID"></div><div class="field"><label>密钥</label><input name="secret" type="password" maxlength="512" placeholder="Webhook 签名密钥或 Telegram Bot Token"><div class="channel-secret-note">目标和密钥会使用 NYASM_NOTIFICATION_KEY 加密保存，接口不会返回明文。</div></div><div class="error-text"></div><div class="actions"><button class="btn" type="button" id="close-modal">取消</button><button class="btn primary" type="submit">保存渠道</button></div></form>`;}else if(type==='rule'){title=rule.id?'编辑告警规则':'添加告警规则';content=`<form id="rule-form" class="form"><div class="field"><label>名称</label><input name="name" required maxlength="128" value="${esc(rule.name||'')}"></div><div class="form-row"><div class="field"><label>类型</label><select name="type" id="rule-type" class="rule-type">${ruleTypeOptions(rule.type||'node_offline')}</select></div><div class="field"><label>阈值</label><input name="threshold" type="number" step="0.1" value="${Number(rule.threshold||0)}"><div class="channel-secret-note">资源、丢包使用百分比；延迟使用毫秒；TLS 过期使用秒。</div></div></div><div class="form-row"><div class="field"><label>持续时间（秒）</label><input name="duration_seconds" type="number" min="0" max="604800" value="${Number(rule.duration_seconds||0)}"></div><div class="field"><label>重复通知冷却（秒）</label><input name="cooldown_seconds" type="number" min="0" max="2592000" value="${Number(rule.cooldown_seconds||0)}"></div></div><label class="auto-refresh"><input name="enabled" type="checkbox"${rule.enabled===false?'':' checked'}> 启用规则</label><div class="field"><label>通知渠道（不选择则使用全部启用渠道）</label>${channels.length?channels.map(channel=>`<label class="auto-refresh"><input name="channel_ids" type="checkbox" value="${esc(channel.id)}"${(rule.channel_ids||[]).includes(channel.id)?' checked':''}> ${esc(channel.name)} · ${esc(channel.type)}</label>`).join(''):'<div class="muted">暂无渠道，规则仍会记录告警事件。</div>'}</div><div class="error-text"></div><div class="actions"><button class="btn" type="button" id="close-modal">取消</button><button class="btn primary" type="submit">保存规则</button></div></form>`;}else{content=`<form id="create-form" class="form"><div class="field"><label>显示名称</label><input name="name" required maxlength="128" placeholder="例如：东京应用服务器"></div><div class="form-row"><div class="field"><label>分组</label><input name="group" maxlength="64" placeholder="production"></div><div class="field"><label>标签</label><input name="tags" maxlength="200" placeholder="web,linux"></div></div>${window.nyasmCountryPickerMarkup?.('country_code','')||''}<div class="error-text"></div><div class="a     function settingsView(){const settings=state.settings||{site_name:state.dashboard?.site_name||'NyaServerMonitor',map_enabled:state.dashboard?.map_enabled!==false};return `<div class="view-head"><div><h2>站点设置</h2><p>统一管理公开首页与管理员首页的站点标识和地图显示。</p></div></div><div class="settings-grid"><section class="panel settings-card"><h3>品牌与首页</h3><p>保存后会同时作用于游客页面和管理员监控首页。</p><form id="site-settings-form" class="form settings-form"><div class="field"><label>站点名称</label><input name="site_name" required maxlength="128" value="${esc(settings.site_name||'NyaServerMonitor')}" placeholder="例如：我的节点监控"></div><label class="settings-toggle"><span><strong>首页地图</strong><small>在统计卡片与节点列表之间显示地区分布地图。</small></span><input name="map_enabled" type="checkbox"${settings.map_enabled===false?'':' checked'}></label><div class="error-text"></div><div class="actions"><button class="btn primary" type="submit">保存设置</button></div></form></section><section class="panel settings-card settings-help"><h3>公开信息边界</h3><div class="event"><span class="event-pin"></span><div><div class="event-title">游客页面只显示允许公开的节点摘要</div><div class="event-detail">IP、主机名、探针版本和管理操作不会通过公开接口返回。</div></div></div><div class="event"><span class="event-pin"></span><div><div class="event-title">地区使用国家代码聚合</div><div class="event-detail">国家/地区标识由后端统一规范化，TW 会按 CN 处理。</div></div></div></section></div>`;}
    function bindSettingsControls(){const form=document.getElementById('site-settings-form');if(!form)return;form.onsubmit=async event=>{event.preventDefault();const error=form.querySelector('.error-text');const save=form.querySelector('button[type="submit"]');if(error)error.textContent='';if(save)save.disabled=true;try{const result=await api('/api/settings/site',{method:'PUT',body:JSON.stringify({site_name:form.elements.site_name.value,map_enabled:form.elements.map_enabled.checked})});state.settings=result;if(state.dashboard){state.dashboard.site_name=result.site_name;state.dashboard.map_enabled=result.map_enabled;}if(state.publicDashboard){state.publicDashboard.site_name=result.site_name;state.publicDashboard.map_enabled=result.map_enabled;}toast('站点设置已保存');render();}catch(err){if(error)error.textContent=err.message;}finally{if(save)save.disabled=false;}};}
    function layout(content){const siteName=state.settings?.site_name||state.dashboard?.site_name||'NyaServerMonitor';document.title=siteName;root.innerHTML=`<div class="shell"><aside class="side"><div><div class="brand"><span class="mark">N</span>${esc(siteName)}</div><div class="subbrand">service management</div></div><nav class="nav"><button id="home-link">监控首页</button><button data-view="nodes" class="${state.view==='nodes'?'active':''}">节点管理</button><button data-view="alerts" class="${state.view==='alerts'?'active':''}">告警管理</button><button data-view="audit" class="${state.view==='audit'?'active':''}">审计日志</button><button data-view="settings" class="${state.view==='settings'?'active':''}">站点设置</button></nav><div class="side-foot"><div>${esc(state.controllerInfo?.version||'')}</div></div></aside><main class="main"><header class="top"><div><h1>管理后台<small>${state.user?.username||''}</small></h1></div><div class="top-actions"><button class="btn small" id="refresh">刷新</button><button class="btn small" id="logout">退出</button></div></header><section class="content">${content}</section>${siteFooterMarkup(siteName)}</main></div>`;document.getElementById('home-link').onclick=()=>go('home');document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{state.view=button.dataset.view;state.selected=null;state.metrics=[];state.modal=null;render();refresh(true);});document.getElementById('refresh').onclick=()=>refresh(true);document.getElementById('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'}).catch(()=>{});state.user=null;stopTelemetryStream();go('home');};}
    function render(){if(!state.user){if(state.showLogin||state.area==='admin'){authPage();const back=document.getElementById('back-public');if(back)back.onclick=()=>go('home');return;}root.innerHTML=publicPage();const login=document.getElementById('public-login');if(login)login.onclick=()=>{state.showLogin=true;state.error='';render();};bindPublicControls();return;}if(state.area==='home'){privateHome();return;}let content=state.view==='nodes'?nodesView():state.view==='alerts'?alertsView():state.view==='settings'?settingsView():auditView();layout(content);bindNodeItems();bindAlertControls();if(state.view==='nodes')bindAdminNodeControls();if(state.view==='settings')bindSettingsControls();const create=document.getElementById('new-node');if(create)create.onclick=()=>showCreate();const install=document.getElementById('install-node');if(install)install.onclick=()=>rotateToken('install');const rotate=document.getElementById('rotate-token');if(rotate)rotate.onclick=()=>rotateToken('rotate');const revoke=document.getElementById('revoke-node');if(revoke)revoke.onclick=()=>changeNode('revoke');const restore=document.getElementById('restore-node');if(restore)restore.onclick=()=>changeNode('restore');const range=document.getElementById('metric-range');if(range)range.onchange=async event=>{state.metricsHours=Number(event.target.value)||24;await loadSelectedMetrics(true);};if(state.modal)renderModal();}
    async function refresh(force=false){if(!state.user)return;try{if(state.area==='admin'&&state.view==='settings'){state.settings=await api('/api/settings/site');const content=document.querySelector('.content');if(content){content.innerHTML=settingsView();bindSettingsControls();}else render();}else if(state.area==='admin'&&state.view==='audit'){state.audit=(await api('/api/audit?limit=100')).events||[];const content=document.querySelector('.content');if(content)content.innerHTML=auditView();else render();}else if(state.area==='admin'&&state.view==='alerts'){state.alerts=await api('/api/alerts?limit=100');const content=document.querySelector('.content');if(content){content.innerHTML=alertsView();bindAlertControls();}else render();}else{state.dashboard=await api('/api/dashboard');state.nodes=state.dashboard.nodes||[];state.settings={site_name:state.dashboard.site_name,map_enabled:state.dashboard.map_enabled};if(state.selected)state.selected=state.nodes.find(node=>node.id===state.selected.id)||null;updatePrivateDashboardView();}}catch(e){if(!state.user)render();else if(force)toast(e.message,true);}}

  </script>
  <script>
    (() => {
      const themeStorageKey = 'nyasm_theme';
      const themeDefinitions = Object.freeze({ dark: '黑色', light: '白色' });
      let activeTheme = 'dark';
      const loadTheme = () => {
        try {
          const value = window.localStorage.getItem(themeStorageKey);
          return Object.prototype.hasOwnProperty.call(themeDefinitions, value) ? value : 'dark';
        } catch (_) {
          return 'dark';
        }
      };
      const applyTheme = (value, persist = true) => {
        const next = Object.prototype.hasOwnProperty.call(themeDefinitions, value) ? value : 'dark';
        activeTheme = next;
        document.documentElement.dataset.theme = next;
        document.documentElement.style.colorScheme = next;
        if (persist) {
          try { window.localStorage.setItem(themeStorageKey, next); } catch (_) {}
        }
        document.querySelectorAll('[data-theme-value]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeValue === next)));
      };
      const themeControlMarkup = () => `<div class="theme-switch" data-theme-control role="group" aria-label="主题"><span class="theme-switch-label">主题</span><button type="button" data-theme-value="dark" aria-pressed="${activeTheme === 'dark'}">${themeDefinitions.dark}</button><button type="button" data-theme-value="light" aria-pressed="${activeTheme === 'light'}">${themeDefinitions.light}</button></div>`;
      const bindThemeControl = control => {
        if (!control || control.dataset.themeBound === 'true') return;
        control.dataset.themeBound = 'true';
        control.querySelectorAll('[data-theme-value]').forEach(button => button.onclick = () => applyTheme(button.dataset.themeValue));
      };
      const ensureThemeControls = () => {
        document.querySelectorAll('.public-top,.private-top,.top').forEach(host => {
          let target = host.querySelector('.top-actions');
          if (!target && host.classList.contains('public-top')) {
            target = document.createElement('div');
            target.className = 'top-actions';
            while (host.children.length > 1) target.append(host.lastElementChild);
            host.append(target);
          }
          if (target && !target.querySelector('[data-theme-control]')) target.insertAdjacentHTML('beforeend', themeControlMarkup());
        });
        document.querySelectorAll('.auth-box').forEach(box => {
          if (box.querySelector('[data-theme-control]')) return;
          const brand = box.querySelector('.auth-brand');
          if (brand) brand.insertAdjacentHTML('afterend', `<div class="auth-theme-switch">${themeControlMarkup()}</div>`);
          else box.insertAdjacentHTML('afterbegin', `<div class="auth-theme-switch">${themeControlMarkup()}</div>`);
        });
        document.querySelectorAll('[data-theme-control]').forEach(bindThemeControl);
      };
      window.addEventListener('storage', event => { if (event.key === themeStorageKey) applyTheme(event.newValue, false); });
      applyTheme(loadTheme(), false);

      const svgNamespace = 'http://www.w3.org/2000/svg';
      const worldMapAssetPath = '/assets/world-map.svg';
      let worldMapSourcePromise = null;
      const loadWorldMapSource = () => {
        if (!worldMapSourcePromise) {
          worldMapSourcePromise = fetch(worldMapAssetPath, { credentials: 'same-origin' }).then(response => {
            if (!response.ok) throw new Error('world map unavailable');
            return response.text();
          });
        }
        return worldMapSourcePromise;
      };
      const labelMapCountries = staticGroup => {
        staticGroup.querySelectorAll('.world-map-land[data-iso],.world-map-land-muted[data-iso]').forEach(path => {
          const rawCode = String(path.getAttribute('data-iso') || '').trim().toUpperCase();
          const code = window.nyasmMapCountryCode?.(rawCode) || '';
          if (!code) return;
          const name = window.nyasmCountryName?.(code) || code;
          path.dataset.mapCountry = code;
          path.setAttribute('aria-label', '国家/地区 ' + name);
          if (!path.querySelector('title')) {
            const title = document.createElementNS(svgNamespace, 'title');
            title.textContent = name;
            path.append(title);
          }
        });
      };
      const hydrateMap = async surface => {
        const svg = surface?.querySelector('.world-map-svg');
        if (!svg || svg.dataset.mapHydrated || svg.dataset.mapHydrating === 'true') return;
        svg.dataset.mapHydrating = 'true';
        svg.querySelector(':scope > title')?.remove();
        try {
          const sourceText = await loadWorldMapSource();
          if (!surface.isConnected || !svg.isConnected) return;
          const documentSource = new DOMParser().parseFromString(sourceText, 'image/svg+xml');
          const source = documentSource.documentElement;
          if (!source || source.nodeName.toLowerCase() !== 'svg' || documentSource.querySelector('parsererror')) throw new Error('invalid world map');
          const staticGroup = document.createElementNS(svgNamespace, 'g');
          staticGroup.dataset.mapStatic = 'true';
          [...source.children].forEach(child => staticGroup.append(document.importNode(child, true)));
          labelMapCountries(staticGroup);
          const markers = svg.querySelector('[data-map-markers]');
          if (markers) svg.insertBefore(staticGroup, markers);
          else svg.append(staticGroup);
          surface.querySelector('.world-map-base')?.remove();
          svg.dataset.mapHydrated = 'true';
        } catch (_) {
          svg.dataset.mapHydrated = 'fallback';
        } finally {
          delete svg.dataset.mapHydrating;
        }
      };
      const hydrateMaps = () => document.querySelectorAll('[data-map-surface]').forEach(surface => { void hydrateMap(surface); });

      const nodeID = () => {
        for (const item of document.querySelectorAll('.detail-meta > div')) {
          if (item.querySelector('.meta-label')?.textContent?.trim() === '节点 ID') {
            return item.querySelector('.meta-value')?.textContent?.trim() || '';
          }
        }
        return '';
      };
      const request = async (path, options = {}) => {
        const response = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
        let body = null;
        try { body = await response.json(); } catch (_) {}
        if (!response.ok) throw new Error(body?.error || response.statusText);
        return body;
      };
      const escapeChartText = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character]));
      const formatBytes = value => {
        const number = Number(value || 0);
        if (!Number.isFinite(number) || number <= 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        const index = number < 1 ? 0 : Math.min(units.length - 1, Math.floor(Math.log(number) / Math.log(1024)));
        const precision = number < 1 ? 1 : index ? 1 : 0;
        return (number / Math.pow(1024, index)).toFixed(precision) + ' ' + units[index];
      };
      const homeMemoryPercent = sample => {
        const total = Number(sample?.metrics?.memory_total_bytes || 0);
        return total ? Number(sample.metrics.memory_used_bytes || 0) / total * 100 : 0;
      };
      const homeDiskPercent = sample => {
        const disks = sample?.metrics?.disks || [];
        const total = disks.reduce((sum, disk) => sum + Number(disk.total_bytes || 0), 0);
        const used = disks.reduce((sum, disk) => sum + Number(disk.used_bytes || 0), 0);
        return total ? used / total * 100 : 0;
      };
      const homeChartLine = (samples, getter, formatter) => {
        const source = samples || [];
        const chartSampleLimit = 180;
        const visible = source.length <= chartSampleLimit ? source : Array.from({ length: chartSampleLimit }, (_, index) => source[Math.round(index * (source.length - 1) / (chartSampleLimit - 1))]);
        if (!visible.length) return '<div class="empty chart-empty">暂无历史指标</div>';
        const values = visible.map(sample => {
          const value = Number(getter(sample));
          return Number.isFinite(value) ? value : 0;
        });
        let min = Math.min(...values);
        let max = Math.max(...values);
        let range = max - min;
        if (range === 0) {
          range = Math.max(Math.abs(max) * .2, 1);
          min = Math.max(0, min - range / 2);
          max += range / 2;
        } else {
          const padding = range * .1;
          min = Math.max(0, min - padding);
          max += padding;
        }
        const width = 640;
        const height = 190;
        const left = 42;
        const right = 10;
        const top = 12;
        const bottom = 30;
        const plotWidth = width - left - right;
        const plotHeight = height - top - bottom;
        const baseY = top + plotHeight;
        const pointAt = (value, index) => {
          const x = visible.length === 1 ? left + plotWidth / 2 : left + index / (visible.length - 1) * plotWidth;
          const y = top + (max - value) / (max - min) * plotHeight;
          return { x, y };
        };
        const points = values.map(pointAt);
        const pointString = points.map(point => `${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(' ');
        const areaPath = `M ${points[0].x.toFixed(2)} ${baseY.toFixed(2)} L ${pointString.replace(/,/g, ' ')} L ${points[points.length - 1].x.toFixed(2)} ${baseY.toFixed(2)} Z`;
        const gridValues = [max, (max + min) / 2, min];
        const grid = gridValues.map(value => {
          const y = top + (max - value) / (max - min) * plotHeight;
          return `<line class="chart-grid-line" x1="${left}" y1="${y.toFixed(2)}" x2="${width - right}" y2="${y.toFixed(2)}"></line><text class="chart-axis-label" x="${left - 8}" y="${(y + 3).toFixed(2)}" text-anchor="end">${escapeChartText(formatter(value))}</text>`;
        }).join('');
        const labelIndexes = [0, Math.floor((visible.length - 1) / 2), visible.length - 1].filter((index, position, all) => all.indexOf(index) === position);
        const labels = labelIndexes.map(index => {
          const date = new Date(visible[index].observed_at);
          const label = Number.isNaN(date.getTime()) ? '--' : `${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
          const point = points[index];
          return `<text class="chart-axis-label" x="${point.x.toFixed(2)}" y="${height - 7}" text-anchor="middle">${escapeChartText(label)}</text>`;
        }).join('');
        const circles = points.map((point, index) => {
          const date = new Date(visible[index].observed_at);
          const timestamp = Number.isNaN(date.getTime()) ? '未知时间' : date.toLocaleString();

              if (chart) chart.innerHTML=adminHistoryMarkup(result?.samples || []);
              const meta=body.querySelector('.detail-meta');
              if (meta) meta.insertAdjacentHTML('beforeend',adminDetailExtraMarkup(currentNode));
              replaceStoredNode(currentNode);
            } else {
              const meta=body.querySelector('.public-detail-meta');
              if (meta) meta.insertAdjacentHTML('beforeend',publicDetailExtraMarkup(currentNode));
              const detailRoot=body.querySelector('.public-detail');
              if (detailRoot) detailRoot.insertAdjacentHTML('beforeend',`<div class="service-history-host public-service-history-host">${serviceCheckHistoryMarkup(currentNode, result?.samples || [], previousSelection)}</div>`);
            }
            const samples = trimDetailSamples(result?.samples || []);
            const definitions = serviceCheckDefinitions(currentNode, samples);
            activeDetail = { serial, nodeID: node.id, node: currentNode, admin, body, hours, resolutionSeconds: Number(result?.resolution_seconds) || detailDefaultResolutionSeconds, samples, selectedCheckIDs: normalizeServiceCheckSelection(definitions, previousSelection) };
            bindChartInteractions(body);
            bindServiceCheckControls();
            const currentTitle = modal.querySelector('.modal-head h3');
            if (currentTitle) currentTitle.textContent = currentNode.name;
            if (admin) {
              const range = body.querySelector('#metric-range');
              if (range) { range.value = String(hours); range.onchange = () => load(Number(range.value) || 24); }
              const rotate = body.querySelector('#rotate-token');
              if (rotate) rotate.onclick = async () => { try { const credential = await request('/api/nodes/' + encodeURIComponent(node.id) + '/rotate-token', { method: 'POST' }); showCredential(credential); } catch (error) { window.alert(error.message); } };
              const revoke = body.querySelector('#revoke-node');
              const restore = body.querySelector('#restore-node');
              const action = revoke ? 'revoke' : 'restore';
              const actionButton = revoke || restore;
              if (actionButton) actionButton.onclick = async () => { if (!window.confirm((action === 'revoke' ? '撤销' : '恢复') + '节点 ' + node.name + '？')) return; try { await request('/api/nodes/' + encodeURIComponent(node.id) + '/' + action, { method: 'POST' }); close(); window.location.reload(); } catch (error) { window.alert(error.message); } };
              startDetailRefresh();
            }
          } catch (error) {
            if (serial === detailModalSerial) body.innerHTML = '<div class="empty">历史指标加载失败：' + escapeChartText(error.message) + '</div>';
          }
        };
        await load(24);
      };
      const showPublicNodeDetail = async id => {
        try {
          const dashboard = await request('/api/public/dashboard');
          const node = dashboard?.nodes?.find(item => item.id === id);
          if (node) await showNodeDetail(node, false);
        } catch (error) {
          window.alert(error.message);
        }
      };
      window.nyasmOpenNodeDetail = showNodeDetail;
      const bindPublicNodeCards = () => {
        document.querySelectorAll('[data-public-node]').forEach(card => {
          if (card.dataset.publicBound === 'true') return;
          card.dataset.publicBound = 'true';
          const open = () => showPublicNodeDetail(card.dataset.publicNode);
          card.onclick = open;
          card.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } };
        });
      };
      window.nyasmBindPublicNodeCards = bindPublicNodeCards;
      const bindPrivateNodeCards = () => {
        document.querySelectorAll('.private-page .node-card[data-node]').forEach(card => {
          if (card.dataset.detailBound === 'true') return;
          card.dataset.detailBound = 'true';
          const open = () => window.nyasmSelectNode?.(card.dataset.node);
          card.onclick = open;
          card.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); } };
        });
      };
      const showCredential = data => {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        const modal = document.createElement('section');
        modal.className = 'modal';
        const head = document.createElement('header');
        head.className = 'modal-head';
        const title = document.createElement('h3');
        title.textContent = '节点安装命令';
        const close = document.createElement('button');
        close.className = 'close';
        close.type = 'button';
        close.textContent = '×';
        const body = document.createElement('div');
        body.className = 'modal-body';
        const note = document.createElement('div');
        note.className = 'notice';
        note.textContent = '安装命令只读取当前 token，不会轮换凭据。轮换凭据请使用节点详情中的独立操作。';
        const commandLabel = document.createElement('div');
        commandLabel.className = 'field';
        commandLabel.innerHTML = '<label>一键安装命令</label>';
        const command = document.createElement('pre');
        command.className = 'token';
        command.textContent = data.install_command || '当前 controller 未配置可下载的 node 二进制。';
        commandLabel.append(command);
        const envLabel = document.createElement('div');
        envLabel.className = 'field';
        envLabel.innerHTML = '<label>节点环境文件</label>';
        const env = document.createElement('pre');
        env.className = 'token';
        env.textContent = data.env || '';
        envLabel.append(env);
        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        const copy = (value, message) => {
          if (!navigator.clipboard) return;
          navigator.clipboard.writeText(value).then(() => window.alert(message)).catch(() => window.alert('复制失败'));
        };
        const copyCommand = document.createElement('button');
        copyCommand.className = 'btn';
        copyCommand.type = 'button';
        copyCommand.textContent = '复制安装命令';
        copyCommand.onclick = () => copy(command.textContent, '已复制安装命令');
        const copyEnv = document.createElement('button');
        copyEnv.className = 'btn';
        copyEnv.type = 'button';
        copyEnv.textContent = '复制环境文件';
        copyEnv.onclick = () => copy(env.textContent, '已复制环境文件');
        const done = document.createElement('button');
        done.className = 'btn primary';
        done.type = 'button';
        done.textContent = '完成';
        done.onclick = () => backdrop.remove();
        actions.append(copyCommand, copyEnv, done);
        head.append(title, close);
        body.append(note, commandLabel, envLabel, actions);
        modal.append(head, body);
        backdrop.append(modal);
        close.onclick = () => backdrop.remove();
        backdrop.onclick = event => { if (event.target === backdrop) backdrop.remove(); };
        document.body.append(backdrop);
      };
      const showNodeEditor = node => {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        const modal = document.createElement('section');
        modal.className = 'modal';
        const head = document.createElement('header');
        head.className = 'modal-head';
        const title = document.createElement('h3');
        title.textContent = '编辑节点信息';
        const close = document.createElement('button');
        close.className = 'close';
        close.type = 'button';
        close.textContent = '×';
        const body = document.createElement('div');
        body.className = 'modal-body';
        const note = document.createElement('div');
        note.className = 'notice';
        note.textContent = '出口 IP 来自节点的公网探测上报，国家会在公网 IP 变化时自动识别。手动选择后自动值不会覆盖；选择自动识别即可恢复。';
        const form = document.createElement('form');
        form.className = 'form';
        const field = (labelText, name, value, maxLength, placeholder) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'field';
          const label = document.createElement('label');
          label.textContent = labelText;
          const input = document.createElement('input');
          input.name = name;
          input.value = value || '';
          input.maxLength = maxLength;
          input.placeholder = placeholder || '';
          input.required = name === 'name';
          wrapper.append(label, input);
          return wrapper;
        };
        const countryField=document.createElement('div');
        countryField.innerHTML=window.nyasmCountryPickerMarkup?.('country_code', node.country_override)||'';
        form.append(
          field('显示名称', 'name', node.name, 128, '例如：东京应用服务器'),
          field('分组', 'group', node.group, 64, 'production'),
          field('标签', 'tags', (node.tags || []).join(', '), 200, 'web,linux'),
          field('展示 IP（手动覆盖）', 'ip_override', node.ip_override, 64, '留空使用出口 IP'),
          countryField.firstElementChild || field('国家/地区代码（手动覆盖）', 'country_code', node.country_override, 2, '例如 CN')
        );
        const errorText = document.createElement('div');
        errorText.className = 'error-text';
        const actions = document.createElement('div');
        actions.className = 'actions';
        const cancel = document.createElement('button');
        cancel.className = 'btn';
        cancel.type = 'button';
        cancel.textContent = '取消';
        const save = document.createElement('button');
        save.className = 'btn primary';
        save.type = 'submit';
        save.textContent = '保存';
        actions.append(cancel, save);
        form.append(errorText, actions);
        head.append(title, close);
        body.append(note, form);
        modal.append(head, body);
        backdrop.append(modal);
        const dismiss = () => backdrop.remove();
        close.onclick = dismiss;
        cancel.onclick = dismiss;
        backdrop.onclick = event => { if (event.target === backdrop) dismiss(); };
        form.onsubmit = async event => {
          event.preventDefault();
          save.disabled = true;
          errorText.textContent = '';
          const data = Object.fromEntries(new FormData(form));
          data.tags = String(data.tags || '').split(',').map(value => value.trim()).filter(Boolean);
          try {
            await request('/api/nodes/' + encodeURIComponent(node.id), { method: 'PUT', body: JSON.stringify(data) });
            dismiss();
            window.location.reload();
          } catch (error) {
            errorText.textContent = error.message;
            save.disabled = false;
          }
        };
        window.nyasmBindCountryPicker?.(form);
        document.body.append(backdrop);
      };
      const install = event => {
        if (event.target?.id !== 'install-node') return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const id = nodeID();
        if (!id) return;
        request('/api/nodes/' + encodeURIComponent(id) + '/install', { method: 'POST' }).then(showCredential).catch(error => window.alert(error.message));
      };
      const edit = event => {
        if (event.target?.id !== 'edit-node') return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const id = nodeID();
        if (!id) return;
        request('/api/nodes/' + encodeURIComponent(id)).then(showNodeEditor).catch(error => window.alert(error.message));
      };
      const update = event => {
        if (event.target?.id !== 'update-node') return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const id = nodeID();
        if (!id || !window.confirm('向该节点下发当前已签名的 node 更新？')) return;
        request('/api/nodes/' + encodeURIComponent(id) + '/update', { method: 'POST' }).then(() => window.alert('更新请求已下发；节点会在控制通道中校验签名后执行。')).catch(error => window.alert(error.message));
      };
      const updateAll = event => {
        if (event.target?.id !== 'update-all-nodes') return;
        event.preventDefault();
        if (!window.confirm('向所有需要更新的节点下发当前已签名的 node 更新？')) return;
        request('/api/nodes/update', { method: 'POST' }).then(result => window.alert('已请求 ' + (result.requested || 0) + ' 个节点更新。')).catch(error => window.alert(error.message));
      };
      const decorate = () => {
        const installButton = document.getElementById('install-node');
        if (installButton && !document.getElementById('edit-node')) {
          const button = document.createElement('button');
          button.id = 'edit-node';
          button.className = 'btn small';
          button.type = 'button';
          button.textContent = '编辑信息';
          installButton.before(button);
        }
        if (installButton && !document.getElementById('update-node')) {
          const button = document.createElement('button');
          button.id = 'update-node';
          button.className = 'btn small';
          button.type = 'button';
          button.textContent = '下发更新';
          button.disabled = installButton.disabled;
          installButton.after(button);
        }
        const actions = document.querySelector('.view-head .actions');
        if (actions && !document.getElementById('update-all-nodes') && document.querySelector('.view-head h2')?.textContent?.trim() === '节点管理') {
          const button = document.createElement('button');
          button.id = 'update-all-nodes';
          button.className = 'btn';
          button.type = 'button';
          button.textContent = '全部下发更新';
          actions.append(button);
        }
        for (const text of document.querySelectorAll('.event-detail')) {
          if (text.textContent.includes('不会向子节点发送 shell、脚本、配置或更新指令')) {
            text.textContent = text.textContent.replace('不会向子节点发送 shell、脚本、配置或更新指令', '不会向子节点发送 shell、脚本或配置；更新只能使用签名发布物');
          }
        }
        ensureThemeControls();
        hydrateMaps();
        bindPublicNodeCards();
        bindPrivateNodeCards();
        bindChartInteractions();
        syncHomeLayout();
      };
      document.addEventListener('click', install, true);
      document.addEventListener('click', edit, true);
      document.addEventListener('click', update, true);
      document.addEventListener('click', updateAll, true);
      new MutationObserver(decorate).observe(document.body, { childList: true, subtree: true });
      decorate();
    })();
  </script>
  <style>
    .channel-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
  </style>
</body>
</html>
