    .layout-switch{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}.layout-switch button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 10px;font-size:12px}.layout-switch button:last-child{border-right:0}.layout-switch button:hover,.layout-switch button.active{background:var(--panel-2);color:var(--text)}.layout-switch button.active{box-shadow:inset 0 -2px var(--green)}.home-layout-cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.home-layout-cards .node-card{padding:12px}.home-layout-cards .node-card-meta,.home-layout-cards .node-card-foot{display:none}.home-layout-cards .node-card-subline{margin-top:6px}.home-layout-cards .node-resource-grid{gap:8px;margin-top:10px}.home-layout-rows{grid-template-columns:1fr;gap:6px}.home-layout-rows .node-card{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(4,minmax(84px,1fr));align-items:center;gap:10px;padding:9px 12px;box-shadow:none}.home-layout-rows .node-card-subline,.home-layout-rows .node-card-meta,.home-layout-rows .node-card-foot{display:none}.home-layout-rows .node-resource-grid{display:contents}.home-layout-rows .resource-meter,.home-layout-rows .resource-detail{display:none}.home-layout-rows .resource-head{font-size:12px}
    @media(max-width:700px){.layout-switch{width:100%}.layout-switch button{flex:1}.home-layout-rows .node-card{grid-template-columns:1fr 1fr;gap:8px 12px}.home-layout-rows .node-card-head{grid-column:1/-1}.home-layout-rows .resource-head{font-size:11px}}
    @media(max-width:900px){.alert-grid,.history-grid{grid-template-columns:1fr}}

<body>
  <div id="root"></div>
  <script>
  (() => {
    const root = document.getElementById('root');
    const routeArea = () => window.location.pathname.replace(/\/+$/, '') === '/admin' ? 'admin' : 'home';
    const state = { user:null, area:routeArea(), view:routeArea()==='admin'?'nodes':'overview', dashboard:null, publicDashboard:null, alerts:null, nodes:[], selected:null, metrics:[], metricsHours:24, setup:false, showLogin:false, error:'', modal:null, busy:false, autoRefresh:true, refreshTimer:null, filters:{query:'',status:'all',group:'all'} };
    const go = (area, replace=false) => { const path=area==='admin'?'/admin':'/'; if(window.location.pathname!==path)history[replace?'replaceState':'pushState']({},'',path); state.area=area;state.view=area==='admin'?'nodes':'overview';state.selected=null;state.metrics=[];state.modal=null;state.showLogin=false;state.error='';startAutoRefresh();render();if(state.user)refresh(true);else refreshPublic(true); };
    window.addEventListener('popstate',()=>{state.area=routeArea();state.view=state.area==='admin'?'nodes':'overview';state.selected=null;state.metrics=[];state.modal=null;state.showLogin=!state.user&&state.area==='admin';render();if(state.user)refresh(true);else refreshPublic(true);});
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const fmtTime = value => { if (!value) return '从未'; const d = new Date(value); return isNaN(d)||d.getUTCFullYear()<2001 ? '从未' : d.toLocaleString(); };
    const fmtBytes = value => { const n = Number(value || 0); if (!n) return '0 B'; const units=['B','KB','MB','GB','TB']; const i=Math.min(units.length-1,Math.floor(Math.log(n)/Math.log(1024))); return (n/Math.pow(1024,i)).toFixed(i?1:0)+' '+units[i]; };
    const pctNumber = value => { const number=Number(value); return Number.isFinite(number)?Math.max(0,Math.min(100,number)):0; };
    const pct = value => pctNumber(value).toFixed(1)+'%';
    const fmtDuration = value => { const seconds=Math.max(0,Math.floor(Number(value||0))); if(!seconds)return '--'; const days=Math.floor(seconds/86400); const hours=Math.floor(seconds%86400/3600); const minutes=Math.floor(seconds%3600/60); if(days)return days+'天 '+hours+'时'; if(hours)return hours+'时 '+minutes+'分'; return Math.max(1,minutes)+'分'; };
    const nodeGroup = node => String(node?.group||'未分组');
    const memoryPercent = node => { const total=Number(node?.metrics?.memory_total_bytes||0); return total?Number(node.metrics.memory_used_bytes||0)/total*100:0; };
    const diskMetrics = node => node?.metrics?.disks||[];
    const diskName = disk => String(disk?.device||disk?.mount||'磁盘');
    const diskUsePercent = disk => { const total=Number(disk?.total_bytes||0); return total?Number(disk?.used_bytes||0)/total*100:0; };
    const diskPercent = node => Math.max(0,...diskMetrics(node).map(diskUsePercent));
    const diskOverallPercent = node => { const disks=diskMetrics(node); const total=disks.reduce((sum,disk)=>sum+Number(disk.total_bytes||0),0); const used=disks.reduce((sum,disk)=>sum+Number(disk.used_bytes||0),0); return total?used/total*100:0; };
    const networkTotal = node => (node?.metrics?.networks||[]).reduce((total,item)=>total+Number(item.bytes_in||0)+Number(item.bytes_out||0),0);
    const checksSummary = node => { const checks=node?.checks||[]; return {total:checks.length,up:checks.filter(c=>c.status==='up').length,down:checks.filter(c=>c.status!=='up').length}; };
    const nodeHasDegraded = node => checksSummary(node).down>0;
    const hasTelemetry = node => { if(!node?.last_seen)return false; const date=new Date(node.last_seen); return !isNaN(date)&&date.getUTCFullYear()>=2001; };
    const visibleNodes = nodes => { const query=String(state.filters.query||'').trim().toLowerCase(); return (nodes||[]).filter(node=>{ const haystack=[node.name,node.id,node.group,node.last_ip,node.system?.hostname,node.system?.os,node.system?.arch,...(node.tags||[])].filter(Boolean).join(' ').toLowerCase(); const statusMatch=state.filters.status==='all'||(state.filters.status==='degraded'?nodeHasDegraded(node):node.status===state.filters.status); return (!query||haystack.includes(query))&&statusMatch&&(state.filters.group==='all'||nodeGroup(node)===state.filters.group); }); };
    const api = async (path, options={}) => { const controller=typeof AbortController==='function'?new AbortController():null; const timeout=setTimeout(()=>controller?.abort(),15000); let response; try { response=await fetch(path, {credentials:'same-origin', headers:{'Content-Type':'application/json', ...(options.headers||{})}, ...options, ...(controller?{signal:controller.signal}:{})}); } catch (error) { if (error?.name==='AbortError') throw new Error('请求超时，请稍后重试'); throw error; } finally { clearTimeout(timeout); } let body=null; try { body=await response.json(); } catch (_) {} if (!response.ok) { if (response.status===401 && path!=='/api/auth/login') { state.user=null; state.showLogin=state.area==='admin'; startAutoRefresh(); } throw new Error(body?.error || response.statusText); } return body; };
    const toast = (message, error=false) => { const el=document.createElement('div'); el.className='toast'+(error?' error':''); el.textContent=message; document.body.appendChild(el); setTimeout(()=>el.remove(),3200); };
    const setBusy = value => { state.busy=value; document.querySelectorAll('button').forEach(b=>b.disabled=value); };
    function startAutoRefresh(){if(state.refreshTimer)clearInterval(state.refreshTimer);state.refreshTimer=setInterval(()=>{if(!state.autoRefresh||state.busy)return;if(state.user)refresh();else refreshPublic();},30000);}
    function stopAutoRefresh(){if(state.refreshTimer){clearInterval(state.refreshTimer);state.refreshTimer=null;}}
    async function bootstrap(){ try { const setup=await api('/api/setup/status'); state.setup=setup.needs_setup; if (!state.setup) { try { state.user=await api('/api/me'); } catch (_) {} } state.publicDashboard=await api('/api/public/dashboard'); } catch (e) { state.error=e.message; } render(); startAutoRefresh(); if(state.user)refresh(); }
    function authPage(){ const setup=state.setup; const fromAdmin=state.area==='admin'; root.innerHTML=`<main class="auth-page"><section class="auth-box"><button class="btn small public-back" id="back-public" type="button">← 返回公开状态</button><div class="auth-brand"><span class="mark">N</span>NyaServerMonitor</div><h1>${setup?'初始化主节点':'管理员登录'}</h1><p>${setup?'创建唯一的本地管理员账户。密码不会以明文保存。':fromAdmin?'进入管理后台，管理节点和审计记录。':'登录后查看节点状态、IP 和详细监控信息。'}</p><form id="auth-form" class="form"><div class="field"><label>用户名</label><input name="username" autocomplete="username" required minlength="3" maxlength="64"></div><div class="field"><label>密码</label><input name="password" type="password" autocomplete="${setup?'new-password':'current-password'}" required minlength="12"></div>${setup?'':'<div class="field"><label>双因素验证码（启用后）</label><input name="totp_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"></div>'}<div class="error-text">${esc(state.error)}</div><button class="btn primary" type="submit">${setup?'完成初始化':'登录'}</button></form></section></main>`; document.getElementById('auth-form').onsubmit=async e=>{e.preventDefault();state.error='';const data=Object.fromEntries(new FormData(e.target));const targetArea=state.area;setBusy(true);try{state.user=await api(setup?'/api/setup':'/api/auth/login',{method:'POST',body:JSON.stringify(data)});state.setup=false;go(targetArea,true);}catch(err){state.error=err.message;render();}finally{setBusy(false);}}; }
    function layout(content){ root.innerHTML=`<div class="shell"><aside class="side"><div><div class="brand"><span class="mark">N</span>NyaServerMonitor</div><div class="subbrand">service management</div></div><nav class="nav"><button id="home-link">监控首页</button><button data-view="nodes" class="${state.view==='nodes'?'active':''}">节点管理</button><button data-view="alerts" class="${state.view==='alerts'?'active':''}">告警管理</button><button data-view="audit" class="${state.view==='audit'?'active':''}">审计日志</button></nav><div class="side-foot"><div class="security-line"><span class="dot"></span>只上报模式</div><div>v0.1.0-dev</div></div></aside><main class="main"><header class="top"><div><h1>管理后台<small>${state.user?.username||''}</small></h1></div><div class="top-actions"><button class="btn small" id="refresh">刷新</button><button class="btn small" id="logout">退出</button></div></header><section class="content">${content}</section></main></div>`; document.getElementById('home-link').onclick=()=>go('home'); document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;state.selected=null;state.metrics=[];render();refresh();}); document.getElementById('refresh').onclick=()=>refresh(true); document.getElementById('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'}).catch(()=>{});state.user=null;go('home');}; }
    function publicMetric(label,value,available){const number=pctNumber(value);const text=available?number+'%':'--';const tone=number>=90?'bad':number>=75?'warn':'';return `<div class="public-metric"><div class="public-metric-head"><span>${label}</span><strong>${text}</strong></div><div class="public-meter ${tone}"><span style="width:${available?number:0}%"></span></div></div>`;}
    function publicNodeCards(nodes){if(!nodes?.length)return '<div class="public-empty"><strong>暂无公开节点</strong><span>探针连接后，状态会显示在这里。</span></div>';return nodes.map(node=>{const degraded=Number(node.checks_total||0)>Number(node.checks_up||0);const available=node.status!=='pending';const checks=node.checks_total?`${node.checks_up}/${node.checks_total} 正常`:'未配置';return `<article class="public-node-card ${esc(node.status)}${degraded?' degraded':''}"><div class="public-node-head"><div class="public-node-title"><strong>${esc(node.name)}</strong><span>${degraded?'服务检查异常':'节点服务'}</span></div>${statusBadge(node.status)}</div><div class="public-node-subline">${degraded?'<span class="badge degraded"><span class="mini-dot"></span>检查异常</span>':'<span>状态正常</span>'}</div><div class="public-metric-grid">${publicMetric('CPU',node.cpu_percent,available)}${publicMetric('内存',node.memory_percent,available)}${publicMetric('磁盘',node.disk_percent,available)}</div><div class="public-node-foot"><span>检查 <strong>${esc(checks)}</strong></span><span>资源为公开摘要</span></div></article>`;}).join('');}
    function publicPage(){const d=state.publicDashboard||{nodes:[]};const generated=d.generated_at_unix?d.generated_at_unix*1000:null;return `<main class="public-page"><header class="public-top"><div class="public-brand"><span class="mark">N</span>NyaServerMonitor<small>公开状态</small></div><button class="btn small" id="public-login">${state.setup?'管理员初始化':'管理员登录'}</button></header><section class="public-main"><div class="public-hero"><div><div class="public-kicker">PUBLIC STATUS</div><h1>服务状态</h1><p>查看节点可用性与公开资源摘要。</p></div><div class="public-updated">更新于 ${fmtTime(generated)}</div></div><div class="public-stats"><div class="public-stat"><div class="label">节点总数</div><div class="value">${d.total_nodes||0}</div></div><div class="public-stat online"><div class="label">在线</div><div class="value">${d.online_nodes||0}</div></div><div class="public-stat offline"><div class="label">离线</div><div class="value">${d.offline_nodes||0}</div></div><div class="public-stat alert"><div class="label">检查异常</div><div class="value">${d.degraded_nodes||0}</div></div></div><section class="public-wall"><div class="public-wall-head"><h2>节点状态</h2><span>${d.pending_nodes||0} 个待上报</span></div><div class="public-node-grid">${publicNodeCards(d.nodes)}</div>${state.error?'<div class="public-error">公开状态暂时不可用，请稍后重试。</div>':''}</section></section></main>`;}
    function privateHome(){
      const d=state.dashboard||{nodes:[]};
      const nodes=d.nodes||[];
      const visible=visibleNodes(nodes);
      const degradedNodes=nodes.filter(nodeHasDegraded).length;
      const pendingNodes=nodes.filter(n=>n.status==='pending').length;
      const generated=d.generated_at_unix?d.generated_at_unix*1000:null;
      root.innerHTML=`<main class="private-page"><header class="private-top"><div class="private-brand"><span class="mark">N</span>NyaServerMonitor<small>管理员监控</small></div><div class="top-actions"><span class="private-user">${esc(state.user?.username||'')}</span><button class="btn small" id="private-admin">管理后台</button><button class="btn small" id="private-refresh">刷新</button><button class="btn small" id="private-logout">退出</button></div></header><section class="private-main"><div class="view-head"><div><div class="public-kicker">PRIVATE MONITORING</div><h2>监控首页</h2><p>显示节点的详细状态、地址和运行指标。</p></div><div class="public-updated">更新于 ${fmtTime(generated)}</div></div><div class="grid stats"><div class="stat"><div class="label">节点总数</div><div class="value">${d.total_nodes||0}</div><div class="hint">已注册节点</div></div><div class="stat"><div class="label">在线</div><div class="value good">${d.online_nodes||0}</div><div class="hint">正在上报</div></div><div class="stat"><div class="label">离线</div><div class="value ${d.offline_nodes?'warn':''}">${d.offline_nodes||0}</div><div class="hint">超过离线阈值</div></div><div class="stat"><div class="label">检查异常</div><div class="value ${degradedNodes?'bad':''}">${degradedNodes}</div><div class="hint">${d.degraded_checks||0} 个服务检查</div></div><div class="stat"><div class="label">待上报</div><div class="value ${pendingNodes?'warn':''}">${pendingNodes}</div><div class="hint">尚未连接</div></div><div class="stat"><div class="label">已撤销</div><div class="value ${d.revoked_nodes?'bad':''}">${d.revoked_nodes||0}</div><div class="hint">凭据已失效</div></div></div><div class="monitor-toolbar"><div class="search-field"><span class="search-icon">⌕</span><input id="node-search" type="search" value="${esc(state.filters.query)}" placeholder="搜索节点、主机、IP 或标签" aria-label="搜索节点"></div><label class="filter-select">状态<select id="status-filter"><option value="all"${state.filters.status==='all'?' selected':''}>全部状态</option><option value="online"${state.filters.status==='online'?' selected':''}>在线</option><option value="degraded"${state.filters.status==='degraded'?' selected':''}>检查异常</option><option value="offline"${state.filters.status==='offline'?' selected':''}>离线</option><option value="pending"${state.filters.status==='pending'?' selected':''}>待上报</option><option value="revoked"${state.filters.status==='revoked'?' selected':''}>已撤销</option></select></label><label class="filter-select">分组<select id="group-filter">${groupOptions(nodes)}</select></label><label class="auto-refresh"><input id="auto-refresh" type="checkbox"${state.autoRefresh?' checked':''}> 自动刷新</label><span id="node-count" class="monitor-count muted">${visible.length} / ${nodes.length} 个节点</span></div><section class="node-wall"><div class="wall-head"><h3>节点状态墙</h3><span class="muted">更新于 ${fmtTime(generated)}</span></div><div id="node-grid" class="node-grid">${nodeCards(visible)}</div>${state.error?'<div class="public-error">监控数据暂时不可用，请稍后重试。</div>':''}</section><div class="grid columns" style="margin-top:24px"><section class="panel"><div class="panel-head"><h3>当前会话</h3><span class="muted">私有数据</span></div><div class="panel-body"><div class="event"><span class="event-pin"></span><div><div class="event-title">管理员视图已启用</div><div class="event-detail">节点地址、主机信息、系统信息和详细指标仅通过登录会话返回。</div></div></div><div class="event"><span class="event-pin"></span><div><div class="event-title">公开首页仍可访问</div><div class="event-detail">退出后会回到不含敏感字段的公开状态页。</div></div></div></div></section><section class="panel"><div class="panel-head"><h3>节点控制边界</h3><span class="muted">只读监控</span></div><div class="panel-body"><div class="event"><span class="event-pin"></span><div><div class="event-title">主节点只接收探针报告</div><div class="event-detail">不会向子节点发送 shell、脚本、配置或更新指令。</div></div></div><div class="event"><span class="event-pin"></span><div><div class="event-title">管理操作集中在后台</div><div class="event-detail">节点创建、凭据轮换、撤销和审计记录位于管理后台。</div></div></div></div></section></div></section></main>`;
      document.getElementById('private-admin').onclick=()=>go('admin');
      document.getElementById('private-refresh').onclick=()=>refresh(true);
      document.getElementById('private-logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'}).catch(()=>{});state.user=null;go('home');};
      bindOverviewControls();
      const privateStats=root.querySelector('.private-page .grid.stats');if(privateStats)privateStats.insertAdjacentHTML('beforeend',`<div class="stat"><div class="label">活动告警</div><div class="value ${d.active_alerts?'bad':''}">${d.active_alerts||0}</div><div class="hint">需要关注的事件</div></div>`);if(d.recent_alerts?.length)root.querySelector('.private-main')?.insertAdjacentHTML('beforeend',`<section class="panel" style="margin-top:16px"><div class="panel-head"><h3>最近告警</h3><button class="btn small" id="private-alerts">管理告警</button></div><div class="panel-body">${alertEventRows(d.recent_alerts)}</div></section>`);const privateAlerts=document.getElementById('private-alerts');if(privateAlerts)privateAlerts.onclick=()=>{go('admin');state.view='alerts';render();refresh();};
    }
    function statusBadge(status){const label={online:'在线',offline:'离线',pending:'待上报',revoked:'已撤销'}[status]||status;return `<span class="badge ${esc(status)}"><span class="mini-dot"></span>${label}</span>`;}
    function nodeRows(nodes){ if(!nodes?.length)return '<tr><td colspan="6" class="empty">还没有节点。创建一个节点并在目标机器上运行探针。</td></tr>'; return nodes.map(n=>`<tr data-node="${esc(n.id)}"><td><div class="node-name">${esc(n.name)}</div><div class="node-id">${esc(n.id)}</div></td><td>${statusBadge(n.status)}</td><td>${esc(n.system?.hostname||'未上报')}<div class="muted">${esc(n.system?.os||'')} ${esc(n.system?.arch||'')}</div></td><td><div class="mono">${esc(n.agent_version||'待上报')}</div></td><td>${n.status==='online'?pct(n.metrics?.cpu_percent):'--'}<div class="muted">${n.status==='online'?fmtBytes(n.metrics?.memory_used_bytes)+' / '+fmtBytes(n.metrics?.memory_total_bytes):'--'}</div></td><td>${fmtTime(n.last_seen)}</td></tr>`).join(''); }
    function resourceMarkup(label,value,detail,tone=''){const barValue=parseFloat(value)||0;return `<div class="resource"><div class="resource-head"><span>${label}</span><span class="resource-value">${value}</span></div><div class="resource-meter ${tone}"><span style="width:${pctNumber(barValue)}%"></span></div><div class="resource-detail" title="${esc(detail)}">${esc(detail)}</div></div>`;}
    function diskResourceMarkup(node,telemetry){const disks=diskMetrics(node);if(!telemetry||!disks.length)return resourceMarkup('磁盘','--','暂无数据');const peak=diskPercent(node);const lines=disks.map(disk=>`<span class="disk-line"><span class="disk-label mono">${esc(diskName(disk))}</span><span class="disk-value">${diskUsePercent(disk).toFixed(1)}% · ${esc(fmtBytes(disk.used_bytes))} / ${esc(fmtBytes(disk.total_bytes))}</span></span>`).join('');const title=disks.map(disk=>`${diskName(disk)} · ${diskUsePercent(disk).toFixed(1)}% · ${fmtBytes(disk.used_bytes)} / ${fmtBytes(disk.total_bytes)}`).join(' | ');return `<div class="resource disk-resource"><div class="resource-head"><span>磁盘</span><span class="resource-value">${peak.toFixed(1)}%</span></div><div class="resource-meter ${peak>=90?'bad':peak>=75?'warn':''}"><span style="width:${pctNumber(peak)}%"></span></div><div class="resource-detail disk-details" title="${esc(title)}">${lines}</div></div>`;}
    function nodeCard(node){const telemetry=hasTelemetry(node);const memory=memoryPercent(node);const checks=checksSummary(node);const degraded=nodeHasDegraded(node);const network=networkTotal(node);const hostname=node.system?.hostname||'未上报';const platform=[node.system?.os,node.system?.arch].filter(Boolean).join(' / ')||'系统信息待上报';const address=node.last_ip||node.system?.ip||'地址待上报';const checkText=checks.total?`${checks.up}/${checks.total} 正常`:'未配置';return `<article class="node-card ${esc(node.status)}${degraded?' degraded':''}" data-node="${esc(node.id)}" role="button" tabindex="0" aria-label="查看 ${esc(node.name)} 详情"><div class="node-card-head"><div class="node-card-title"><strong>${esc(node.name)}</strong><span>${esc(hostname)} · ${esc(platform)}</span></div>${statusBadge(node.status)}</div><div class="node-card-subline"><span>${esc(nodeGroup(node))}</span>${(node.tags||[]).slice(0,3).map(tag=>`<span class="node-tag">${esc(tag)}</span>`).join('')}${degraded?'<span class="badge degraded"><span class="mini-dot"></span>检查异常</span>':''}</div><div class="node-card-meta"><div class="node-meta-item"><div class="meta-label">地址</div><div class="meta-value mono" title="${esc(address)}">${esc(address)}</div></div><div class="node-meta-item"><div class="meta-label">探针</div><div class="meta-value mono">${esc(node.agent_version||'待上报')}</div></div></div><div class="node-resource-grid">${resourceMarkup('CPU',telemetry?pct(node.metrics?.cpu_percent):'--',telemetry?`${Number(node.metrics?.cpu_percent||0).toFixed(1)}% 使用率`:'暂无数据',telemetry&&Number(node.metrics?.cpu_percent||0)>=90?'bad':telemetry&&Number(node.metrics?.cpu_percent||0)>=75?'warn':'')}${resourceMarkup('内存',telemetry?memoryPercent(node).toFixed(1)+'%':'--',telemetry?`${fmtBytes(node.metrics?.memory_used_bytes)} / ${fmtBytes(node.metrics?.memory_total_bytes)}`:'暂无数据',memory>=90?'bad':memory>=75?'warn':'')}${diskResourceMarkup(node,telemetry)}${resourceMarkup('负载',telemetry?Number(node.metrics?.load1||0).toFixed(2):'--',telemetry?`${node.system?.cpu_count||'?'} 核 · 1 分钟`:'暂无数据','')}</div><div class="node-card-foot"><span class="node-foot-item">服务 <strong>${esc(checkText)}</strong></span><span class="node-foot-item">流量 <strong>${fmtBytes(network)}</strong></span><span class="node-foot-item">运行 <strong>${fmtDuration(node.metrics?.uptime_seconds)}</strong></span><span class="node-foot-item">上报 <strong>${fmtTime(node.last_seen)}</strong></span></div></article>`;}
    function nodeCards(nodes){if(!nodes?.length){const filtered=state.filters.query||state.filters.status!=='all'||state.filters.group!=='all';return `<div class="card-empty"><strong>${filtered?'没有匹配的节点':'还没有节点'}</strong><span>${filtered?'调整筛选条件后重试。':'创建节点后，探针上报的实时状态会显示在这里。'}</span></div>`;}return nodes.map(nodeCard).join('');}
    function groupOptions(nodes){const groups=[...new Set((nodes||[]).map(nodeGroup))].sort((a,b)=>a.localeCompare(b,'zh-CN'));return `<option value="all">全部分组</option>${groups.map(group=>`<option value="${esc(group)}"${state.filters.group===group?' selected':''}>${esc(group)}</option>`).join('')}`;}
    function eventRows(events){ if(!events?.length)return '<div class="empty">暂无审计事件</div>'; return events.map(e=>`<div class="event"><span class="event-pin"></span><div><div class="event-title">${esc(e.action)}</div><div class="event-detail">${esc(e.actor)} · ${esc(e.target)}</div></div><div class="event-time">${fmtTime(e.created_at)}</div></div>`).join(''); }
    function overview(){const d=state.dashboard||{nodes:[],recent_events:[]};const nodes=d.nodes||[];const visible=visibleNodes(nodes);const degradedNodes=nodes.filter(nodeHasDegraded).length;const pendingNodes=nodes.filter(n=>n.status==='pending').length;const generated=d.generated_at_unix?d.generated_at_unix*1000:null;return `<div class="view-head"><div><h2>监控总览</h2><p>所有节点的最新状态与资源概览。</p></div><div class="actions"><button class="btn primary" id="new-node">+ 添加节点</button></div></div><div class="grid stats"><div class="stat"><div class="label">节点总数</div><div class="value">${d.total_nodes||0}</div><div class="hint">已注册节点</div></div><div class="stat"><div class="label">在线</div><div class="value good">${d.online_nodes||0}</div><div class="hint">正在上报</div></div><div class="stat"><div class="label">离线</div><div class="value ${d.offline_nodes?'warn':''}">${d.offline_nodes||0}</div><div class="hint">超过离线阈值</div></div><div class="stat"><div class="label">检查异常</div><div class="value ${degradedNodes?'bad':''}">${degradedNodes}</div><div class="hint">${d.degraded_checks||0} 个服务检查</div></div><div class="stat"><div class="label">待上报</div><div class="value ${pendingNodes?'warn':''}">${pendingNodes}</div><div class="hint">尚未连接</div></div><div class="stat"><div class="label">已撤销</div><div class="value ${d.revoked_nodes?'bad':''}">${d.revoked_nodes||0}</div><div class="hint">凭据已失效</div></div></div><div class="monitor-toolbar"><div class="search-field"><span class="search-icon">⌕</span><input id="node-search" type="search" value="${esc(state.filters.query)}" placeholder="搜索节点、主机、IP 或标签" aria-label="搜索节点"></div><label class="filter-select">状态<select id="status-filter"><option value="all"${state.filters.status==='all'?' selected':''}>全部状态</option><option value="online"${state.filters.status==='online'?' selected':''}>在线</option><option value="degraded"${state.filters.status==='degraded'?' selected':''}>检查异常</option><option value="offline"${state.filters.status==='offline'?' selected':''}>离线</option><option value="pending"${state.filters.status==='pending'?' selected':''}>待上报</option><option value="revoked"${state.filters.status==='revoked'?' selected':''}>已撤销</option></select></label><label class="filter-select">分组<select id="group-filter">${groupOptions(nodes)}</select></label><label class="auto-refresh"><input id="auto-refresh" type="checkbox"${state.autoRefresh?' checked':''}> 自动刷新</label><span id="node-count" class="monitor-count muted">${visible.length} / ${nodes.length} 个节点</span></div><section class="node-wall"><div class="wall-head"><h3>节点状态墙</h3><span class="muted">更新于 ${fmtTime(generated)}</span></div><div id="node-grid" class="node-grid">${nodeCards(visible)}</div></section><div class="grid columns" style="margin-top:24px"><section class="panel"><div class="panel-head"><h3>最近审计</h3><button class="btn small" data-view="audit">查看全部</button></div><div class="panel-body">${eventRows(d.recent_events)}</div></section><section class="panel"><div class="panel-head"><h3>运行说明</h3><span class="muted">只读汇总</span></div><div class="panel-body"><div class="event"><span class="event-pin"></span><div><div class="event-title">主节点只接收探针报告</div><div class="event-detail">不会向子节点发送 shell、脚本、配置或更新指令。</div></div></div><div class="event"><span class="event-pin"></span><div><div class="event-title">凭据由节点独立持有</div><div class="event-detail">token 仅在创建或轮换时显示，数据库只保存派生哈希。</div></div></div></div></section></div>`;}
     function nodesView(){return `<div class="view-head"><div><h2>节点管理</h2><p>安装命令仅读取当前凭据；轮换凭据会立即使旧 token 失效。</p></div><div class="actions"><button class="btn primary" id="new-node">+ 添加节点</button></div></div><section class="panel"><div class="panel-head"><h3>全部节点</h3><span class="muted">${state.nodes.length} 个</span></div><div class="table-wrap"><table class="table"><thead><tr><th>节点</th><th>状态</th><th>主机</th><th>探针版本</th><th>CPU / 内存</th><th>最近上报</th></tr></thead><tbody>${nodeRows(state.nodes)}</tbody></table></div></section>${state.selected?detailView(state.selected):''}`;}
     function chartLine(samples,getter,formatter){const visible=(samples||[]).slice(-72);if(!visible.length)return '<div class="empty chart-empty">暂无历史指标</div>';const values=visible.map(sample=>{const value=Number(getter(sample));return Number.isFinite(value)?value:0;});let min=Math.min(...values),max=Math.max(...values),range=max-min;if(range===0){range=Math.max(Math.abs(max)*.2,1);min=Math.max(0,min-range/2);max=max+range/2;}else{const padding=range*.1;min=Math.max(0,min-padding);max=max+padding;}const width=640,height=190,left=42,right=10,top=12,bottom=30,plotWidth=width-left-right,plotHeight=height-top-bottom,baseY=top+plotHeight;const pointAt=(value,index)=>{const x=visible.length===1?left+plotWidth/2:left+index/(visible.length-1)*plotWidth;const y=top+(max-value)/(max-min)*plotHeight;return {x,y};};const points=values.map(pointAt);const pointString=points.map(point=>`${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(' ');const areaPath=`M ${points[0].x.toFixed(2)} ${baseY.toFixed(2)} L ${pointString.replace(/,/g,' ')} L ${points[points.length-1].x.toFixed(2)} ${baseY.toFixed(2)} Z`;const gridValues=[max,(max+min)/2,min];const grid=gridValues.map(value=>{const y=top+(max-value)/(max-min)*plotHeight;return `<line class="chart-grid-line" x1="${left}" y1="${y.toFixed(2)}" x2="${width-right}" y2="${y.toFixed(2)}"></line><text class="chart-axis-label" x="${left-8}" y="${(y+3).toFixed(2)}" text-anchor="end">${esc(formatter(value))}</text>`;}).join('');const labelIndexes=[0,Math.floor((visible.length-1)/2),visible.length-1].filter((index,position,all)=>all.indexOf(index)===position);const labels=labelIndexes.map(index=>{const date=new Date(visible[index].observed_at);const label=Number.isNaN(date.getTime())?'--':`${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;const point=points[index];return `<text class="chart-axis-label" x="${point.x.toFixed(2)}" y="${height-7}" text-anchor="middle">${esc(label)}</text>`;}).join('');const circles=points.map((point,index)=>{const date=new Date(visible[index].observed_at);const timestamp=Number.isNaN(date.getTime())?'未知时间':date.toLocaleString();return `<circle class="chart-point" cx="${point.x.toFixed(2)}" cy="${point.y.toFixed(2)}" r="2.8"><title>${esc(timestamp)} · ${esc(formatter(values[index]))}</title></circle>`;}).join('');return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="历史指标折线图"><g>${grid}${labels}</g><path class="chart-area" d="${areaPath}"></path><polyline class="chart-line" points="${pointString}"></polyline><g>${circles}</g></svg>`;}
     function historyCard(title,samples,getter,formatter){return `<div class="history-card"><h4>${title}</h4><div class="chart">${chartLine(samples,getter,formatter)}</div></div>`;}
     function detailView(n){const samples=state.metrics||[];const memoryValue=s=>{const total=Number(s.metrics?.memory_total_bytes||0);return total?Number(s.metrics?.memory_used_bytes||0)/total*100:0;};const networkValue=s=>(s.metrics?.networks||[]).reduce((total,item)=>total+Number(item.bytes_in||0)+Number(item.bytes_out||0),0);const diskValue=s=>diskOverallPercent({metrics:s.metrics});const checkRows=n.checks?.length?n.checks.map(c=>{const detail=c.type==='ping'?`${Number(c.latency_ms||0)} ms · 丢包 ${Number(c.packet_loss_percent||0).toFixed(1)}%`:c.type==='tls'?`${c.tls_expires_at_unix?fmtTime(Number(c.tls_expires_at_unix)*1000):'无到期时间'} · ${esc(c.tls_version||'TLS')}`:c.status==='up'?`${Number(c.latency_ms||0)} ms`:esc(c.message||'down');return `<div class="metric-row"><span>${esc(c.name)}</span><span class="check-status-line">${statusBadge(c.status==='up'?'online':c.status==='unknown'?'pending':'offline')}<span class="mono">${detail}</span></span><span class="mono">${esc(c.type)}</span></div>`;}).join(''):'<div class="muted" style="margin-top:8px">该节点未配置本地检查。</div>';return `<section class="panel" style="margin-top:16px"><div class="panel-head"><h3>${esc(n.name)} · 详情</h3><div class="actions"><label class="filter-select">范围<select id="metric-range"><option value="1"${state.metricsHours===1?' selected':''}>1 小时</option><option value="6"${state.metricsHours===6?' selected':''}>6 小时</option><option value="24"${state.metricsHours===24?' selected':''}>24 小时</option><option value="168"${state.metricsHours===168?' selected':''}>7 天</option><option value="720"${state.metricsHours===720?' selected':''}>30 天</option></select></label><button class="btn small primary" id="install-node"${n.status==='revoked'?' disabled':''}>生成安装命令</button><button class="btn small" id="rotate-token">轮换凭据</button>${n.status==='revoked'?'<button class="btn small" id="restore-node">恢复</button>':'<button class="btn small danger" id="revoke-node">撤销</button>'}</div></div><div class="panel-body"><div class="muted" style="margin-bottom:16px">安装命令只读取当前 token，不会轮换凭据；需要失效旧 token 时，请使用独立的轮换操作。历史指标由 controller 按时间范围降采样。</div><div class="detail-meta"><div><div class="meta-label">节点 ID</div><div class="meta-value mono">${esc(n.id)}</div></div><div><div class="meta-label">主机</div><div class="meta-value">${esc(n.system?.hostname||'未上报')}</div></div><div><div class="meta-label">操作系统</div><div class="meta-value">${esc(n.system?.os||'--')} / ${esc(n.system?.arch||'--')}</div></div><div><div class="meta-label">地址</div><div class="meta-value mono">${esc(n.last_ip||n.system?.ip||'--')}</div></div></div><div class="history-grid">${historyCard('CPU',samples,s=>s.metrics?.cpu_percent||0,v=>Number(v).toFixed(1)+'%')}${historyCard('内存',samples,memoryValue,v=>Number(v).toFixed(1)+'%')}${historyCard('磁盘',samples,diskValue,v=>Number(v).toFixed(1)+'%')}${historyCard('负载 1m',samples,s=>s.metrics?.load1||0,v=>Number(v).toFixed(2))}${historyCard('网络累计流量',samples,networkValue,v=>fmtBytes(v))}</div><div style="margin-top:22px"><div class="meta-label">服务检查</div>${checkRows}</div></div></section>`;}
    const alertTypeLabel=type=>({node_offline:'节点离线',service_down:'服务检查失败',cpu_high:'CPU 过高',memory_high:'内存过高',disk_high:'磁盘过高',latency_high:'延迟过高',packet_loss_high:'丢包率过高',tls_expiring:'TLS 即将过期',tls_changed:'TLS 证书变化',tls_invalid:'TLS 校验失败'}[type]||type);
    const secondsLabel=value=>{const seconds=Math.max(0,Number(value||0));if(!seconds)return '立即';if(seconds<60)return seconds+' 秒';if(seconds<3600)return Math.round(seconds/60)+' 分钟';if(seconds<86400)return (seconds/3600).toFixed(seconds%3600?1:0)+' 小时';return (seconds/86400).toFixed(seconds%86400?1:0)+' 天';};
    const thresholdLabel=rule=>rule.type==='tls_expiring'?secondsLabel(rule.threshold):rule.type==='latency_high'?Number(rule.threshold||0).toFixed(0)+' ms':Number(rule.threshold||0).toFixed(1)+'%';
    function alertEventRows(events){if(!events?.length)return '<div class="empty">暂无告警事件</div>';return events.map(e=>`<div class="event alert-event-${esc(e.kind)}"><span class="event-pin"></span><div><div class="event-title">${esc(e.rule_name)} · ${esc(e.kind)}</div><div class="event-detail">${esc(e.node_name)} · ${esc(e.message)}${e.notified?' · 已通知':' · 未通知'}</div></div><div class="event-time">${fmtTime(e.created_at)}</div></div>`).join('');}
    function alertRuleRows(rules){if(!rules?.length)return '<div class="empty">暂无告警规则</div>';return `<div class="alert-rule-list">${rules.map(rule=>`<article class="alert-rule"><div class="alert-rule-head"><div><div class="alert-rule-name">${esc(rule.name)}</div><div class="alert-rule-meta"><span>${esc(alertTypeLabel(rule.type))}</span><span>阈值 ${esc(thresholdLabel(rule))}</span><span>持续 ${esc(secondsLabel(rule.duration_seconds))}</span><span>冷却 ${esc(secondsLabel(rule.cooldown_seconds))}</span><span>${rule.enabled?'已启用':'已停用'}</span></div></div><div class="alert-rule-actions"><button class="btn small" data-alert-edit="${esc(rule.id)}">编辑</button><button class="btn small" data-alert-toggle="${esc(rule.id)}">${rule.enabled?'停用':'启用'}</button></div></div></article>`).join('')}</div>`;}
    function alertsView(){const data=state.alerts||{rules:[],channels:[],events:[],active_alerts:0};return `<div class="view-head"><div><h2>告警管理</h2><p>告警只消费节点上报结果，不向节点下发任何配置或执行指令。</p></div><div class="actions"><button class="btn small" id="new-channel">添加通知渠道</button><button class="btn small primary" id="new-rule">添加告警规则</button></div></div><div class="grid stats"><div class="stat"><div class="label">活动告警</div><div class="value ${data.active_alerts?'bad':''}">${data.active_alerts||0}</div><div class="hint">当前仍未恢复</div></div><div class="stat"><div class="label">告警规则</div><div class="value">${data.rules?.length||0}</div><div class="hint">内置规则可编辑</div></div><div class="stat"><div class="label">通知渠道</div><div class="value">${data.channels?.length||0}</div><div class="hint">${data.notification_ready?'密钥已配置':'未配置加密密钥'}</div></div><div class="stat"><div class="label">最近事件</div><div class="value">${data.events?.length||0}</div><div class="hint">仅管理员可见</div></div></div><div class="alert-grid"><section class="panel"><div class="panel-head"><h3>告警规则</h3><span class="muted">资源、服务、TLS 和网络</span></div><div class="panel-body">${alertRuleRows(data.rules)}</div></section><section class="panel"><div class="panel-head"><h3>通知渠道</h3><span class="muted">密文保存</span></div><div class="panel-body">${data.channels?.length?data.channels.map(c=>`<div class="event"><span class="event-pin"></span><div><div class="event-title">${esc(c.name)}</div><div class="event-detail">${esc(c.type)} · ${esc(c.target)}</div></div><button class="btn small danger" data-channel-delete="${esc(c.id)}">删除</button></div>`).join(''):'<div class="empty">暂无通知渠道。需先设置 NYASM_NOTIFICATION_KEY。</div>'}</div></section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><h3>最近告警事件</h3><span class="muted">状态变化和冷却提醒</span></div><div class="panel-body">${alertEventRows(data.events)}</div></section>`;}
    function auditView(){return `<div class="view-head"><div><h2>审计日志</h2><p>记录管理员操作与节点生命周期事件。</p></div></div><section class="panel"><div class="panel-body">${eventRows(state.audit||[])}</div></section>`;}
    function bindNodeItems(){if(state.area!=='admin')return;document.querySelectorAll('[data-node]').forEach(item=>{item.onclick=()=>selectNode(item.dataset.node);item.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectNode(item.dataset.node);}};});}

    function bindOverviewControls(){const search=document.getElementById('node-search');const status=document.getElementById('status-filter');const group=document.getElementById('group-filter');const auto=document.getElementById('auto-refresh');if(search)search.oninput=event=>{state.filters.query=event.target.value;updateOverviewWall();};if(status)status.onchange=event=>{state.filters.status=event.target.value;updateOverviewWall();};if(group)group.onchange=event=>{state.filters.group=event.target.value;updateOverviewWall();};if(auto)auto.onchange=event=>{state.autoRefresh=event.target.checked;};}

    function ruleTypeOptions(selected){return [['node_offline','节点离线'],['service_down','服务检查失败'],['cpu_high','CPU 过高'],['memory_high','内存过高'],['disk_high','磁盘过高'],['latency_high','延迟过高'],['packet_loss_high','丢包率过高'],['tls_expiring','TLS 即将过期'],['tls_changed','TLS 证书变化'],['tls_invalid','TLS 校验失败']].map(item=>`<option value="${item[0]}"${selected===item[0]?' selected':''}>${item[1]}</option>`).join('');}

    function renderModal(){const existing=document.querySelector('.modal-backdrop');if(existing)existing.remove();if(!state.modal)return;const type=state.modal==='create'?'node':state.modal.type;const rule=type==='rule'?(state.modal.data||{}):{};const channels=state.alerts?.channels||[];let title='添加节点';let content='';if(type==='credential'){const command=state.modal.data.install_command||'当前 controller 未配置可下载的 node 二进制，请使用环境文件手动部署。';title='节点凭据';content=`<div class="notice">token 只在此处显示。安装命令会从 controller 下载脚本和 node 二进制，并安装 systemd 服务；轮换凭据会立即使旧 token 失效。</div><div class="field"><label>一键安装命令</label><pre class="token" id="install-command">${esc(command)}</pre></div><div class="field"><label>节点环境文件</label><pre class="token" id="credential-env">${esc(state.modal.data.env)}</pre></div><div class="actions" style="margin-top:14px"><button class="btn" id="copy-install">复制安装命令</button><button class="btn" id="copy-env">复制环境文件</button><button class="btn primary" id="close-modal">完成</button></div>`;}else if(type==='channel'){title='添加通知渠道';content=`<form id="channel-form" class="form"><div class="field"><label>名称</label><input name="name" required maxlength="128" placeholder="例如：运维 Webhook"></div><div class="field"><label>类型</label><select name="type"><option value="webhook">Webhook</option><option value="telegram">Telegram</option></select></div><div class="field"><label>目标</label><input name="target" required maxlength="2048" placeholder="Webhook HTTPS URL 或 Telegram Chat ID"></div><div class="field"><label>密钥</label><input name="secret" type="password" maxlength="512" placeholder="Webhook 签名密钥或 Telegram Bot Token"><div class="channel-secret-note">目标和密钥会使用 NYASM_NOTIFICATION_KEY 加密保存，接口不会返回明文。</div></div><div class="error-text"></div><div class="actions"><button class="btn" type="button" id="close-modal">取消</button><button class="btn primary" type="submit">保存渠道</button></div></form>`;}else if(type==='rule'){title=rule.id?'编辑告警规则':'添加告警规则';content=`<form id="rule-form" class="form"><div class="field"><label>名称</label><input name="name" required maxlength="128" value="${esc(rule.name||'')}"></div><div class="form-row"><div class="field"><label>类型</label><select name="type" id="rule-type" class="rule-type">${ruleTypeOptions(rule.type||'node_offline')}</select></div><div class="field"><label>阈值</label><input name="threshold" type="number" step="0.1" value="${Number(rule.threshold||0)}"><div class="channel-secret-note">资源、丢包使用百分比；延迟使用毫秒；TLS 过期使用秒。</div></div></div><div class="form-row"><div class="field"><label>持续时间（秒）</label><input name="duration_seconds" type="number" min="0" max="604800" value="${Number(rule.duration_seconds||0)}"></div><div class="field"><label>重复通知冷却（秒）</label><input name="cooldown_seconds" type="number" min="0" max="2592000" value="${Number(rule.cooldown_seconds||0)}"></div></div><label class="auto-refresh"><input name="enabled" type="checkbox"${rule.enabled===false?'':' checked'}> 启用规则</label><div class="field"><label>通知渠道（不选择则使用全部启用渠道）</label>${channels.length?channels.map(channel=>`<label class="auto-refresh"><input name="channel_ids" type="checkbox" value="${esc(channel.id)}"${(rule.channel_ids||[]).includes(channel.id)?' checked':''}> ${esc(channel.name)} · ${esc(channel.type)}</label>`).join(''):'<div class="muted">暂无渠道，规则仍会记录告警事件。</div>'}</div><div class="error-text"></div><div class="actions"><button class="btn" type="button" id="close-modal">取消</button><button class="btn primary" type="submit">保存规则</button></div></form>`;}else{content=`<form id="create-form" class="form"><div class="field"><label>显示名称</label><input name="name" required maxlength="128" placeholder="例如：东京应用服务器"></div><div class="form-row"><div class="field"><label>分组</label><input name="group" maxlength="64" placeholder="production"></div><div class="field"><label>标签</label><input name="tags" maxlength="200" placeholder="web,linux"></div></div><div class="error-text"></div><div class="actions"><button class="btn" type="button" id="close-modal">取消</button><button class="btn primary" type="submit">创建节点</button></div></form>`;}const box=document.createElement('div');box.className='modal-backdrop';box.innerHTML=`<section class="modal"><header class="modal-head"><h3>${title}</h3><button class="close" id="x-modal">×</button></header><div class="modal-body">${content}</div></section>`;root.appendChild(box);const close=()=>{state.modal=null;box.remove();};document.getElementById('x-modal').onclick=close;document.getElementById('close-modal').onclick=close;if(type==='credential'){const copy=(value,message)=>{if(!navigator.clipboard){toast('浏览器不支持复制',true);return;}navigator.clipboard.writeText(value).then(()=>toast(message)).catch(()=>toast('复制失败',true));};document.getElementById('copy-install').onclick=()=>copy(state.modal.data.install_command||'','已复制安装命令');document.getElementById('copy-env').onclick=()=>copy(state.modal.data.env,'已复制环境文件');}else if(type==='channel')document.getElementById('channel-form').onsubmit=createChannel;else if(type==='rule')document.getElementById('rule-form').onsubmit=saveRule;else document.getElementById('create-form').onsubmit=createNode;}
    async function createNode(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.tags=String(data.tags||'').split(',').map(v=>v.trim()).filter(Boolean);setBusy(true);try{const result=await api('/api/nodes',{method:'POST',body:JSON.stringify(data)});state.modal={type:'credential',data:result};state.nodes=[...(state.nodes||[]),result.node];await refresh(true);toast('节点已创建');}catch(err){e.target.querySelector('.error-text').textContent=err.message;}finally{setBusy(false);}}

    async function saveRule(e){e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form));data.enabled=form.elements.enabled.checked;data.threshold=Number(data.threshold||0);data.duration_seconds=Number(data.duration_seconds||0);data.cooldown_seconds=Number(data.cooldown_seconds||0);data.channel_ids=[...form.querySelectorAll('input[name="channel_ids"]:checked')].map(input=>input.value);const rule=state.modal.data||{};setBusy(true);try{await api(rule.id?'/api/alerts/rules/'+encodeURIComponent(rule.id):'/api/alerts/rules',{method:rule.id?'PUT':'POST',body:JSON.stringify(data)});state.modal=null;await refresh(true);toast('告警规则已保存');}catch(err){form.querySelector('.error-text').textContent=err.message;}finally{setBusy(false);}}
    async function toggleRule(id){const rule=state.alerts?.rules?.find(item=>item.id===id);if(!rule)return;try{await api('/api/alerts/rules/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({name:rule.name,type:rule.type,enabled:!rule.enabled,threshold:rule.threshold,duration_seconds:rule.duration_seconds,cooldown_seconds:rule.cooldown_seconds,channel_ids:rule.channel_ids||[]})});await refresh(true);}catch(e){toast(e.message,true);}}

  <script>
    (() => {
      const nodeID = () => {
        for (const item of document.querySelectorAll('.detail-meta > div')) {
          if (item.querySelector('.meta-label')?.textContent?.trim() === '节点 ID') {
            return item.querySelector('.meta-value')?.textContent?.trim() || '';
          }
        }
        return '';
      };
      const request = async (path, options = {}) => {
        const response = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
        let body = null;
        try { body = await response.json(); } catch (_) {}
        if (!response.ok) throw new Error(body?.error || response.statusText);
        return body;
      };
      const escapeChartText = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character]));
      const homeMemoryPercent = sample => {
        const total = Number(sample?.metrics?.memory_total_bytes || 0);
        return total ? Number(sample.metrics.memory_used_bytes || 0) / total * 100 : 0;
      };
      const homeDiskPercent = sample => {
        const disks = sample?.metrics?.disks || [];
        const total = disks.reduce((sum, disk) => sum + Number(disk.total_bytes || 0), 0);
        const used = disks.reduce((sum, disk) => sum + Number(disk.used_bytes || 0), 0);
        return total ? used / total * 100 : 0;
      };
      const homeChartLine = (samples, getter, formatter) => {
        const visible = (samples || []).slice(-72);
        if (!visible.length) return '<div class="empty chart-empty">暂无历史指标</div>';
        const values = visible.map(sample => {
          const value = Number(getter(sample));
          return Number.isFinite(value) ? value : 0;
        });
        let min = Math.min(...values);
        let max = Math.max(...values);
        let range = max - min;
        if (range === 0) {
          range = Math.max(Math.abs(max) * .2, 1);
          min = Math.max(0, min - range / 2);
          max += range / 2;
        } else {
          const padding = range * .1;
          min = Math.max(0, min - padding);
          max += padding;
        }
        const width = 640;
        const height = 190;
        const left = 42;
        const right = 10;
        const top = 12;
        const bottom = 30;
        const plotWidth = width - left - right;
        const plotHeight = height - top - bottom;
        const baseY = top + plotHeight;
        const pointAt = (value, index) => {
          const x = visible.length === 1 ? left + plotWidth / 2 : left + index / (visible.length - 1) * plotWidth;
          const y = top + (max - value) / (max - min) * plotHeight;
          return { x, y };
        };
        const points = values.map(pointAt);
        const pointString = points.map(point => `${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(' ');
        const areaPath = `M ${points[0].x.toFixed(2)} ${baseY.toFixed(2)} L ${pointString.replace(/,/g, ' ')} L ${points[points.length - 1].x.toFixed(2)} ${baseY.toFixed(2)} Z`;
        const gridValues = [max, (max + min) / 2, min];
        const grid = gridValues.map(value => {
          const y = top + (max - value) / (max - min) * plotHeight;
          return `<line class="chart-grid-line" x1="${left}" y1="${y.toFixed(2)}" x2="${width - right}" y2="${y.toFixed(2)}"></line><text class="chart-axis-label" x="${left - 8}" y="${(y + 3).toFixed(2)}" text-anchor="end">${escapeChartText(formatter(value))}</text>`;
        }).join('');
        const labelIndexes = [0, Math.floor((visible.length - 1) / 2), visible.length - 1].filter((index, position, all) => all.indexOf(index) === position);
        const labels = labelIndexes.map(index => {
          const date = new Date(visible[index].observed_at);
          const label = Number.isNaN(date.getTime()) ? '--' : `${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
          const point = points[index];
          return `<text class="chart-axis-label" x="${point.x.toFixed(2)}" y="${height - 7}" text-anchor="middle">${escapeChartText(label)}</text>`;
        }).join('');
        const circles = points.map((point, index) => {
          const date = new Date(visible[index].observed_at);
          const timestamp = Number.isNaN(date.getTime()) ? '未知时间' : date.toLocaleString();
          return `<circle class="chart-point" cx="${point.x.toFixed(2)}" cy="${point.y.toFixed(2)}" r="2.8"><title>${escapeChartText(timestamp)} · ${escapeChartText(formatter(values[index]))}</title></circle>`;
        }).join('');
        return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="历史指标折线图"><g>${grid}${labels}</g><path class="chart-area" d="${areaPath}"></path><polyline class="chart-line" points="${pointString}"></polyline><g>${circles}</g></svg>`;
      };
      const homeHistoryMarkup = samples => `<div class="history-grid"><div class="history-card"><h4>CPU</h4><div class="chart">${homeChartLine(samples, sample => sample.metrics?.cpu_percent || 0, value => Number(value).toFixed(1) + '%')}</div></div><div class="history-card"><h4>内存</h4><div class="chart">${homeChartLine(samples, homeMemoryPercent, value => Number(value).toFixed(1) + '%')}</div></div><div class="history-card"><h4>磁盘</h4><div class="chart">${homeChartLine(samples, homeDiskPercent, value => Number(value).toFixed(1) + '%')}</div></div><div class="history-card"><h4>负载 1m</h4><div class="chart">${homeChartLine(samples, sample => sample.metrics?.load1 || 0, value => Number(value).toFixed(2))}</div></div></div>`;
      let homeHistoryNodeID = '';
      let homeHistoryHours = 24;
      let homeHistorySerial = 0;
      const homeHistoryNodes = page => [...page.querySelectorAll('.node-card[data-node]')].filter(card => !card.classList.contains('revoked')).map(card => ({ id: card.dataset.node, name: card.querySelector('.node-card-title strong')?.textContent?.trim() || card.dataset.node, online: card.classList.contains('online') }));
      const loadHomeHistory = async panel => {
        const select = panel.querySelector('#home-history-node');
        const content = panel.querySelector('#home-history-content');
        const id = select?.value || '';
        if (!id) {
          content.innerHTML = '<div class="empty">暂无可用节点历史指标</div>';
          return;
        }
        const serial = ++homeHistorySerial;
        panel.dataset.historyKey = id + ':' + homeHistoryHours;
        content.innerHTML = '<div class="empty">正在加载历史指标...</div>';
        try {
          const result = await request('/api/nodes/' + encodeURIComponent(id) + '/metrics?hours=' + homeHistoryHours + '&limit=120');
          if (serial !== homeHistorySerial || !panel.isConnected) return;
          content.innerHTML = homeHistoryMarkup(result?.samples || []);
        } catch (error) {
          if (serial !== homeHistorySerial || !panel.isConnected) return;
          content.innerHTML = '<div class="empty">历史指标加载失败：' + escapeChartText(error.message) + '</div>';
        }
      };
      const syncHomeHistory = () => {
        const page = document.querySelector('.private-page');
        const wall = page?.querySelector('.node-wall');
        if (!page || !wall) return;
        let panel = page.querySelector('#home-history-panel');
        if (!panel) {
          panel = document.createElement('section');
          panel.id = 'home-history-panel';
          panel.className = 'panel';
          panel.style.marginTop = '16px';
          panel.innerHTML = '<div class="panel-head"><h3>资源趋势</h3><div class="actions"><label class="filter-select">节点<select id="home-history-node"></select></label><label class="filter-select">范围<select id="home-history-range"><option value="1">1 小时</option><option value="6">6 小时</option><option value="24">24 小时</option><option value="168">7 天</option></select></label></div></div><div class="panel-body"><div id="home-history-content"></div></div>';
          panel.querySelector('.panel-head').style.flexWrap = 'wrap';
          wall.after(panel);
        }
        const nodes = homeHistoryNodes(page);
        const select = panel.querySelector('#home-history-node');
        const range = panel.querySelector('#home-history-range');
        const signature = nodes.map(node => node.id + ':' + node.name + ':' + node.online).join('|');
        if (panel.dataset.nodeSignature !== signature) {
          panel.dataset.nodeSignature = signature;
          select.replaceChildren();
          nodes.forEach(node => {
            const option = document.createElement('option');
            option.value = node.id;
            option.textContent = node.name + (node.online ? ' · 在线' : ' · 离线');
            select.append(option);
          });
          const preferred = nodes.find(node => node.id === homeHistoryNodeID) || nodes.find(node => node.online) || nodes[0];
          homeHistoryNodeID = preferred?.id || '';
          select.value = homeHistoryNodeID;
        }
        if (!select.dataset.bound) {
          select.dataset.bound = 'true';
          select.onchange = () => {
            homeHistoryNodeID = select.value;
            loadHomeHistory(panel);
          };
          range.onchange = () => {
            homeHistoryHours = Number(range.value) || 24;
            loadHomeHistory(panel);
          };
        }
        range.value = String(homeHistoryHours);
        if (!nodes.length) {
          const content = panel.querySelector('#home-history-content');
          const emptyMarkup = '<div class="empty">暂无可用节点历史指标</div>';
          if (content && content.innerHTML !== emptyMarkup) content.innerHTML = emptyMarkup;
          return;
        }
        const key = homeHistoryNodeID + ':' + homeHistoryHours;
        if (panel.dataset.historyKey !== key) loadHomeHistory(panel);
      };
      let homeLayoutMode = 'detail';
      try { homeLayoutMode = ['detail', 'cards', 'rows'].includes(localStorage.getItem('nyasm_home_layout')) ? localStorage.getItem('nyasm_home_layout') : 'detail'; } catch (_) {}
      const syncHomeLayout = () => {
        const page = document.querySelector('.private-page');
        const toolbar = page?.querySelector('.monitor-toolbar');
        const grid = page?.querySelector('#node-grid');
        if (!page || !toolbar || !grid) return;
        let switcher = toolbar.querySelector('#home-layout-switch');
        if (!switcher) {
          switcher = document.createElement('div');
          switcher.id = 'home-layout-switch';
          switcher.className = 'layout-switch';
          switcher.setAttribute('role', 'group');
          switcher.setAttribute('aria-label', '节点显示方式');
          [['detail', '详细'], ['cards', '卡片'], ['rows', '行']].forEach(([mode, label]) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.homeLayout = mode;
            button.textContent = label;
            button.title = label + '布局';
            button.onclick = () => {
              homeLayoutMode = mode;
              try { localStorage.setItem('nyasm_home_layout', mode); } catch (_) {}
              syncHomeLayout();
            };
            switcher.append(button);
          });
          toolbar.append(switcher);
        }
        grid.classList.remove('home-layout-detail', 'home-layout-cards', 'home-layout-rows');
        grid.classList.add('home-layout-' + homeLayoutMode);
        switcher.querySelectorAll('[data-home-layout]').forEach(button => {
          const active = button.dataset.homeLayout === homeLayoutMode;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
      };
      const showCredential = data => {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        const modal = document.createElement('section');
        modal.className = 'modal';
        const head = document.createElement('header');
        head.className = 'modal-head';
        const title = document.createElement('h3');
        title.textContent = '节点安装命令';
        const close = document.createElement('button');
        close.className = 'close';
        close.type = 'button';
        close.textContent = '×';
        const body = document.createElement('div');
        body.className = 'modal-body';
        const note = document.createElement('div');
        note.className = 'notice';
        note.textContent = '安装命令只读取当前 token，不会轮换凭据。轮换凭据请使用节点详情中的独立操作。';
        const commandLabel = document.createElement('div');
        commandLabel.className = 'field';
        commandLabel.innerHTML = '<label>一键安装命令</label>';
        const command = document.createElement('pre');
        command.className = 'token';
        command.textContent = data.install_command || '当前 controller 未配置可下载的 node 二进制。';
        commandLabel.append(command);
        const envLabel = document.createElement('div');
        envLabel.className = 'field';
        envLabel.innerHTML = '<label>节点环境文件</label>';
        const env = document.createElement('pre');
        env.className = 'token';
        env.textContent = data.env || '';
        envLabel.append(env);
        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        const copy = (value, message) => {
          if (!navigator.clipboard) return;
          navigator.clipboard.writeText(value).then(() => window.alert(message)).catch(() => window.alert('复制失败'));
        };
        const copyCommand = document.createElement('button');
        copyCommand.className = 'btn';
        copyCommand.type = 'button';
        copyCommand.textContent = '复制安装命令';
        copyCommand.onclick = () => copy(command.textContent, '已复制安装命令');
        const copyEnv = document.createElement('button');
        copyEnv.className = 'btn';
        copyEnv.type = 'button';
        copyEnv.textContent = '复制环境文件';
        copyEnv.onclick = () => copy(env.textContent, '已复制环境文件');
        const done = document.createElement('button');
        done.className = 'btn primary';
        done.type = 'button';
        done.textContent = '完成';
        done.onclick = () => backdrop.remove();
        actions.append(copyCommand, copyEnv, done);
        head.append(title, close);
        body.append(note, commandLabel, envLabel, actions);
        modal.append(head, body);
        backdrop.append(modal);
        close.onclick = () => backdrop.remove();
        backdrop.onclick = event => { if (event.target === backdrop) backdrop.remove(); };
        document.body.append(backdrop);
      };
      const showNodeEditor = node => {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        const modal = document.createElement('section');
        modal.className = 'modal';
        const head = document.createElement('header');
        head.className = 'modal-head';
        const title = document.createElement('h3');
        title.textContent = '编辑节点信息';
        const close = document.createElement('button');
        close.className = 'close';
        close.type = 'button';
        close.textContent = '×';
        const body = document.createElement('div');
        body.className = 'modal-body';
        const note = document.createElement('div');
        note.className = 'notice';
        note.textContent = '修改名称、分组和标签只影响后台显示，不会改变探针凭据。';
        const form = document.createElement('form');
        form.className = 'form';
        const field = (labelText, name, value, maxLength, placeholder) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'field';
          const label = document.createElement('label');
          label.textContent = labelText;
          const input = document.createElement('input');
          input.name = name;
          input.value = value || '';
          input.maxLength = maxLength;
          input.placeholder = placeholder || '';
          input.required = name === 'name';
          wrapper.append(label, input);
          return wrapper;
        };
        form.append(
          field('显示名称', 'name', node.name, 128, '例如：东京应用服务器'),
          field('分组', 'group', node.group, 64, 'production'),
          field('标签', 'tags', (node.tags || []).join(', '), 200, 'web,linux')
        );
        const errorText = document.createElement('div');
        errorText.className = 'error-text';
        const actions = document.createElement('div');
        actions.className = 'actions';
        const cancel = document.createElement('button');
        cancel.className = 'btn';
        cancel.type = 'button';
        cancel.textContent = '取消';
        const save = document.createElement('button');
        save.className = 'btn primary';
        save.type = 'submit';
        save.textContent = '保存';
        actions.append(cancel, save);
        form.append(errorText, actions);
        head.append(title, close);
        body.append(note, form);
        modal.append(head, body);
        backdrop.append(modal);
        const dismiss = () => backdrop.remove();
        close.onclick = dismiss;
        cancel.onclick = dismiss;
        backdrop.onclick = event => { if (event.target === backdrop) dismiss(); };
        form.onsubmit = async event => {
          event.preventDefault();
          save.disabled = true;
          errorText.textContent = '';
          const data = Object.fromEntries(new FormData(form));
          data.tags = String(data.tags || '').split(',').map(value => value.trim()).filter(Boolean);
          try {
            await request('/api/nodes/' + encodeURIComponent(node.id), { method: 'PUT', body: JSON.stringify(data) });
            dismiss();
            window.location.reload();
          } catch (error) {
            errorText.textContent = error.message;
            save.disabled = false;
          }
        };
        document.body.append(backdrop);
      };
      const install = event => {
        if (event.target?.id !== 'install-node') return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const id = nodeID();
        if (!id) return;
        request('/api/nodes/' + encodeURIComponent(id) + '/install', { method: 'POST' }).then(showCredential).catch(error => window.alert(error.message));
      };
      const edit = event => {
        if (event.target?.id !== 'edit-node') return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const id = nodeID();
        if (!id) return;
        request('/api/nodes/' + encodeURIComponent(id)).then(showNodeEditor).catch(error => window.alert(error.message));
      };
      const update = event => {
        if (event.target?.id !== 'update-node') return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const id = nodeID();
        if (!id || !window.confirm('向该节点下发当前已签名的 node 更新？')) return;
        request('/api/nodes/' + encodeURIComponent(id) + '/update', { method: 'POST' }).then(() => window.alert('更新请求已下发；节点会在控制通道中校验签名后执行。')).catch(error => window.alert(error.message));
      };
      const updateAll = event => {
        if (event.target?.id !== 'update-all-nodes') return;
        event.preventDefault();
        if (!window.confirm('向所有需要更新的节点下发当前已签名的 node 更新？')) return;
        request('/api/nodes/update', { method: 'POST' }).then(result => window.alert('已请求 ' + (result.requested || 0) + ' 个节点更新。')).catch(error => window.alert(error.message));
      };
      const decorate = () => {
        const installButton = document.getElementById('install-node');
        if (installButton && !document.getElementById('edit-node')) {
          const button = document.createElement('button');
          button.id = 'edit-node';
          button.className = 'btn small';
          button.type = 'button';
          button.textContent = '编辑信息';
          installButton.before(button);
        }
        if (installButton && !document.getElementById('update-node')) {
          const button = document.createElement('button');
          button.id = 'update-node';
          button.className = 'btn small';
          button.type = 'button';
          button.textContent = '下发更新';
          button.disabled = installButton.disabled;
          installButton.after(button);
        }
        const actions = document.querySelector('.view-head .actions');
        if (actions && !document.getElementById('update-all-nodes') && document.querySelector('.view-head h2')?.textContent?.trim() === '节点管理') {
          const button = document.createElement('button');
          button.id = 'update-all-nodes';
          button.className = 'btn';
          button.type = 'button';
          button.textContent = '全部下发更新';
          actions.append(button);
        }
        for (const text of document.querySelectorAll('.event-detail')) {
          if (text.textContent.includes('不会向子节点发送 shell、脚本、配置或更新指令')) {
            text.textContent = text.textContent.replace('不会向子节点发送 shell、脚本、配置或更新指令', '不会向子节点发送 shell、脚本或配置；更新只能使用签名发布物');
          }
        }
        syncHomeLayout();
        syncHomeHistory();
      };
      document.addEventListener('click', install, true);
      document.addEventListener('click', edit, true);
      document.addEventListener('click', update, true);
      document.addEventListener('click', updateAll, true);
      new MutationObserver(decorate).observe(document.body, { childList: true, subtree: true });
      decorate();
    })();
  </script>
</body>
</html>
