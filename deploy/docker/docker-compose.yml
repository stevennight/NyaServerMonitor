name: nya-server-monitor

services:
  controller:
    image: ${NYASM_IMAGE:-nyaservermonitor}:${NYASM_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        NYASM_VERSION: ${NYASM_VERSION:-0.1.0-dev}
        NYASM_UPDATE_PUBLIC_KEY: ${NYASM_UPDATE_PUBLIC_KEY:-}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    environment:
      NYASM_LISTEN: ":8080"
      NYASM_DATA: /data
      NYASM_PUBLIC_URL: ${NYASM_PUBLIC_URL:?set NYASM_PUBLIC_URL in deploy/docker/.env}
      NYASM_NODE_BINARY: /usr/local/bin/nyasm-node
      NYASM_NODE_BINARY_DIR: /usr/local/lib/nyasm
      NYASM_LOG_LEVEL: ${NYASM_LOG_LEVEL:-info}
      NYASM_NOTIFICATION_KEY: ${NYASM_NOTIFICATION_KEY:-}
      NYASM_NODE_TOKEN_KEY: ${NYASM_NODE_TOKEN_KEY:-}
    volumes:
      - ../../data:/data
    ports:
      - "${NYASM_BIND_ADDR:-127.0.0.1}:${NYASM_HOST_PORT:-8080}:8080"
