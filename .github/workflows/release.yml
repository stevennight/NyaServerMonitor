name: Release

on:
  push:
    tags:
      - v*

permissions: {}

jobs:
  release-assets:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      build_date: ${{ steps.release-meta.outputs.build_date }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare release metadata
        id: release-meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
          NYASM_VERSION: ${{ github.ref_name }}
          NYASM_COMMIT: ${{ github.sha }}
          NYASM_BUILD_DATE: ${{ steps.release-meta.outputs.build_date }}
          NYASM_UPDATE_PUBLIC_KEY: ${{ secrets.NYASM_UPDATE_PUBLIC_KEY }}
        run: |
          mkdir -p dist
          update_public_key="$(printf '%s' "$NYASM_UPDATE_PUBLIC_KEY" | tr -d '[:space:]')"
          LDFLAGS="-s -w -X nyaservermonitor/internal/shared/version.Version=${NYASM_VERSION} -X nyaservermonitor/internal/shared/version.Commit=${NYASM_COMMIT} -X nyaservermonitor/internal/shared/version.BuildDate=${NYASM_BUILD_DATE} -X nyaservermonitor/internal/shared/version.UpdatePublicKey=${update_public_key}"
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o dist/nyasm-controller-linux-amd64 ./cmd/controller
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o dist/nyasm-controller-linux-arm64 ./cmd/controller
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o dist/nyasm-node-linux-amd64 ./cmd/node
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o dist/nyasm-node-linux-arm64 ./cmd/node

      - name: Sign node release manifest
        env:
          NYASM_UPDATE_PUBLIC_KEY: ${{ secrets.NYASM_UPDATE_PUBLIC_KEY }}
          NYASM_UPDATE_SIGNING_KEY: ${{ secrets.NYASM_UPDATE_SIGNING_KEY }}
        run: |
          signing_key_file="$RUNNER_TEMP/nyasm-update-signing.key"
          trap 'rm -f "$signing_key_file"' EXIT
          printf '%s' "$NYASM_UPDATE_SIGNING_KEY" > "$signing_key_file"
          update_public_key="$(printf '%s' "$NYASM_UPDATE_PUBLIC_KEY" | tr -d '[:space:]')"
          go run ./cmd/release-manifest \
            --node-dir dist \
            --version "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --build-date "${{ steps.release-meta.outputs.build_date }}" \
            --private-key-file "$signing_key_file" \
            --expected-public-key "$update_public_key" \
            --manifest dist/node-release-manifest.json \
            --signature dist/node-release-manifest.sig \
            --public-key dist/node-release-public.key
          sha256sum dist/* > dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*

  docker-image:
    runs-on: ubuntu-24.04
    needs: release-assets
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NYASM_VERSION=${{ github.ref_name }}
            NYASM_COMMIT=${{ github.sha }}
            NYASM_BUILD_DATE=${{ needs.release-assets.outputs.build_date }}
            NYASM_UPDATE_PUBLIC_KEY=${{ secrets.NYASM_UPDATE_PUBLIC_KEY }}
          secrets: |
            nyasm_update_signing_key=${{ secrets.NYASM_UPDATE_SIGNING_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
