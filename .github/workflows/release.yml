name: Release

on:
  push:
    tags:
      - v*

permissions: {}

jobs:
  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_date: ${{ steps.release-meta.outputs.build_date }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare release metadata
        id: release-meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
          NYASM_VERSION: ${{ github.ref_name }}
          NYASM_COMMIT: ${{ github.sha }}
          NYASM_BUILD_DATE: ${{ steps.release-meta.outputs.build_date }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X nyaservermonitor/internal/shared/version.Version=${NYASM_VERSION} -X nyaservermonitor/internal/shared/version.Commit=${NYASM_COMMIT} -X nyaservermonitor/internal/shared/version.BuildDate=${NYASM_BUILD_DATE}"
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o dist/nyasm-controller-linux-amd64 ./cmd/controller
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o dist/nyasm-controller-linux-arm64 ./cmd/controller
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o dist/nyasm-node-linux-amd64 ./cmd/node
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o dist/nyasm-node-linux-arm64 ./cmd/node
          sha256sum dist/* > dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*

  docker-image:
    runs-on: ubuntu-latest
    needs: release-assets
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NYASM_VERSION=${{ github.ref_name }}
            NYASM_COMMIT=${{ github.sha }}
            NYASM_BUILD_DATE=${{ needs.release-assets.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
