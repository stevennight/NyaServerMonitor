name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            printf 'Files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Test Go
        run: go test ./...

      - name: Test Go with race detector
        run: go test -race ./...

      - name: Vet Go
        run: go vet ./...

      - name: Build Linux targets
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/nyasm-controller-linux-amd64 ./cmd/controller
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o dist/nyasm-controller-linux-arm64 ./cmd/controller
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/nyasm-node-linux-amd64 ./cmd/node
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o dist/nyasm-node-linux-arm64 ./cmd/node

      - name: Validate Docker Compose
        working-directory: deploy/docker
        env:
          NYASM_PUBLIC_URL: https://ci.invalid
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          tags: nyaservermonitor:ci
          load: true
