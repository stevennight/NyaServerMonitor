name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            printf 'Files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Test Go
        run: go test ./...

      - name: Test Go with race detector
        run: go test -race ./...

      - name: Vet Go
        run: go vet ./...

      - name: Build Linux targets
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/nyasm-controller-linux-amd64 ./cmd/controller
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o dist/nyasm-controller-linux-arm64 ./cmd/controller
          GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/nyasm-node-linux-amd64 ./cmd/node
          GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o dist/nyasm-node-linux-arm64 ./cmd/node

      - name: Validate Docker Compose
        working-directory: deploy/docker
        env:
          NYASM_PUBLIC_URL: https://ci.invalid
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          tags: nyaservermonitor:ci
          load: true
